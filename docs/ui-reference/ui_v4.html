<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>

*{box-sizing:border-box;margin:0}
body{font:14px/1.7 var(--ff);color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.shell{display:grid;grid-template-columns:var(--rw,88px) minmax(0,1fr);min-height:100vh}

.rail{background:#082019;color:#BCCFC6;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:12px 6px;gap:2px;overflow:hidden}
.rail .logo{padding:2px 4px 12px}.rail .logo svg{width:76px;height:auto;display:block}
.wide .rail{padding:var(--m) 14px}.wide .rail .logo svg{width:132px}.wide .rail .logo{padding:0 8px var(--m)}
.nav{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:var(--r2);color:#9DB8AC;font-size:11px;line-height:1.2;text-align:center;cursor:pointer;transition:background-color var(--d1) var(--ease),color var(--d1) var(--ease),transform var(--d1) var(--ease)}
.wide .nav{flex-direction:row;gap:12px;height:40px;padding:0 12px;font-size:14px;border-radius:var(--r1);text-align:left}
.nav .num{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:11px;font-weight:600}
@media (hover:hover) and (pointer:fine){.nav:hover{background:rgba(255,255,255,.07);color:#fff}}
.nav:active{transform:scale(.97)}.nav.on{background:rgba(255,255,255,.1);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
.rail .sp{flex:1}.rail .grp{font-size:11px;color:#6E8B7F;padding:12px 12px 4px}.rail .me{border-top:1px solid rgba(255,255,255,.12);padding:12px 8px 0;font-size:12px}
.ic{flex:none}
.bar{display:flex;align-items:center;gap:var(--m);padding:0 var(--pad);height:56px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}
.bar .id{color:var(--accink);font-weight:600}.bar .sp{flex:1}
.step{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}.step i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:11px}
.step.on{color:var(--ink);font-weight:600}.step.on i{background:var(--acc);border-color:var(--acc);color:#fff}.step.done i{background:var(--green);border-color:var(--green);color:#fff}
.stl{width:36px;height:1px;background:var(--line)}
.sel{height:34px;border:1px solid var(--line);border-radius:var(--r1);padding:0 12px;display:inline-flex;align-items:center;gap:8px;background:#fff;cursor:pointer;font-size:13px}
.tabs,.sub{position:relative;display:flex;gap:var(--m);padding:0 var(--pad);border-bottom:1px solid var(--line);color:var(--mut)}
.tabs span,.sub span{padding:12px 0;cursor:pointer;font-weight:500;transition:color var(--d1) var(--ease),font-size var(--d1) var(--ease)}
.sub span{padding:8px 0;font-size:13px}.tabs .on{color:var(--ink);font-weight:700;font-size:16px}.sub .on{color:var(--ink);font-weight:700}
@media (hover:hover) and (pointer:fine){.tabs span:hover,.sub span:hover{color:var(--ink)}}
.ind{position:absolute;bottom:-1px;left:0;height:2px;background:var(--acc);width:10px;transition:transform var(--d3) var(--ease),width var(--d3) var(--ease)}.sub .ind{background:var(--ink)}
.page{transition:opacity 120ms linear}.page.out{opacity:0}.hide{display:none!important}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);padding:0 var(--pad)}.x{grid-column:span var(--w)}
.wide .g,.wide .pad{padding-left:44px;padding-right:44px}.wide .ph{padding-top:var(--s)}
.eb{font-size:12px;color:var(--mut);letter-spacing:.06em;margin-bottom:var(--e)}
.h1{font:600 36px/1.25 var(--fd);margin:0 0 var(--e);letter-spacing:-.01em}.h2{font:600 22px/1.4 var(--fd);margin:0 0 12px}.h3{font:600 18px/1.4 var(--fd);margin-bottom:4px}
.meta{color:var(--mut);font-size:13px}.mut{color:var(--mut)}.sm{font-size:12px;color:var(--mut)}.lead{max-width:62ch;color:var(--mut)}
.sec{padding:var(--m) 0 0}.ph{padding:var(--m) 0 0}.ph .g{align-items:end}
.hero{background:var(--forest);color:#fff}.hero .h1{color:#fff}.hero .meta,.hero .eb{color:#9DB8AC}.hero p{color:#E8F0EC}.hero .g{padding-top:var(--m);padding-bottom:var(--m)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.45);margin-top:var(--m)}
.kp div{padding:var(--e);border-right:1px solid rgba(255,255,255,.2)}.kp div:first-child{padding-left:0}.kp div:last-child{border-right:0}
.kp b{display:block;font:600 30px/1.3 var(--fd)}.kp span{font-size:12px;color:#BCCFC6}
.acts{display:flex;gap:var(--e);justify-content:flex-end;align-items:center;flex-wrap:wrap}
.bt{display:inline-flex;align-items:center;gap:var(--e);font:600 14px var(--ff);height:36px;padding:0 16px;border:1px solid var(--line);border-radius:var(--r1);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;transition:background-color var(--d1) var(--ease),border-color var(--d1) var(--ease),transform var(--d1) var(--ease),color var(--d1) var(--ease)}
@media (hover:hover) and (pointer:fine){.bt:hover{background:var(--wash);border-color:var(--ink)}.bt.p:hover{background:#E85F00;border-color:#E85F00}.bt.dg:hover{background:var(--t-r)}.hero .bt.gh:hover{background:rgba(255,255,255,.1);border-color:#fff}}
.bt:active{transform:scale(.97)}.bt.p{background:var(--acc);border-color:var(--acc)}.bt.sm{height:30px;padding:0 12px;font-size:13px}.bt.dg{color:var(--t-ri);border-color:#E3B3BE}.bt:disabled,.bt.off{background:var(--wash);border-style:dashed;color:var(--mut);cursor:not-allowed}
.hero .bt.gh{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:11px;padding:1px 10px;line-height:1.6;white-space:nowrap;background:var(--t-n);color:var(--t-ni)}
.tag.g{background:var(--t-g);color:var(--t-gi)}.tag.o{background:var(--t-o);color:var(--t-oi)}.tag.b{background:var(--t-b);color:var(--t-bi)}.tag.r{background:var(--t-r);color:var(--t-ri)}.tag.y{background:var(--t-y);color:var(--t-yi)}
.tag.sq{border-radius:var(--r1)}.hero .tag{background:rgba(255,255,255,.14);color:#E8F0EC}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;font-size:13px;font-weight:500;transition:background-color var(--d1) var(--ease),border-color var(--d1) var(--ease),color var(--d1) var(--ease),transform var(--d1) var(--ease)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}.seg span{padding:7px 16px;font-weight:600;cursor:pointer;transition:background-color var(--d1) var(--ease)}.seg span.on{background:#0B2E25;color:#fff}
.lk{color:var(--accink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:var(--r1)}
.card{border:1px solid var(--line);border-radius:var(--r2);padding:var(--m);background:#fff}.card.w{background:var(--wash);border-color:var(--wash)}
.card.press{cursor:pointer;transition:border-color var(--d2) var(--ease),transform var(--d1) var(--ease),background-color var(--d2) var(--ease)}
@media (hover:hover) and (pointer:fine){.card.press:hover{border-color:var(--ink)}}.card.press:active{transform:scale(.985)}.card.press.on{border-color:var(--acc);background:var(--accsoft)}
.cell{background:var(--wash);border-radius:var(--r2);padding:12px 16px}.cell b{display:block;font:600 26px/1.3 var(--fd)}.cell span{font-size:12px;color:var(--mut)}
.tr{height:8px;background:var(--line2);border-radius:4px}.tr i{display:block;height:8px;border-radius:4px}
.chip{display:grid;place-items:center;height:26px;border-radius:var(--r1);font-weight:600;font-size:13px;min-width:48px;padding:0 6px}

.chath{padding:12px var(--m);border-bottom:1px solid var(--line);display:flex;gap:var(--e);align-items:center;font-weight:600}
.ctx{display:flex;gap:6px;padding:8px var(--m);flex-wrap:wrap;border-bottom:1px solid var(--line2)}
.msgs{flex:1;overflow:auto;padding:var(--m);display:flex;flex-direction:column;gap:14px;min-height:0}

.note{font-size:12px;color:var(--mut);padding:8px var(--m)}

.fld{margin-bottom:var(--m)}.fld label{display:block;font-weight:600;margin-bottom:4px}
.inp{width:100%;height:40px;border:1px solid var(--line);border-radius:var(--r1);padding:0 12px;font:inherit;background:#fff;transition:border-color var(--d1) var(--ease)}textarea.inp{padding:10px 12px;height:96px}

.qc{border:1px solid var(--line);border-radius:var(--r2);padding:12px 16px;margin-bottom:12px;background:#fff}.qc .qh{display:flex;gap:12px;align-items:center}

.goal{border-left:3px solid var(--acc);padding:2px 0 2px 14px;margin:6px 0 var(--m)}.lbl{font-weight:700;color:var(--accink);font-size:13px}
.sect{border:1px solid var(--line);border-radius:var(--r2);padding:12px 16px;margin-bottom:12px}.sect .sh{display:flex;gap:var(--e);align-items:center;font-weight:600;margin-bottom:var(--e)}
.vid{aspect-ratio:16/10;background:var(--forest);border-radius:var(--r2);display:grid;place-items:center;color:#9DB8AC;font-size:12px;position:relative}.vid span{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.4);color:#fff;border-radius:4px;padding:0 8px}
.edp{display:inline-flex;gap:6px;align-items:center;border:1px dashed var(--line);border-radius:var(--r1);padding:2px 10px;cursor:pointer;background:#fff;transition:border-color var(--d1) var(--ease),background-color var(--d1) var(--ease)}

.hc{position:absolute;background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:12px 16px;width:320px;z-index:5}
.pad{padding:0 var(--pad)}
.dark{background:var(--forest);color:#fff}.dark .tag{background:rgba(255,255,255,.16);color:#fff}
.qr{width:124px;height:124px;border:1px solid var(--line);border-radius:var(--r1);padding:6px;background:#fff}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0B2E25;color:#fff;border-radius:var(--r2);padding:10px 18px;font-weight:600;display:flex;gap:8px;align-items:center;z-index:9;opacity:0;pointer-events:none;transition:opacity var(--d2) var(--ease)}
.toast.on{opacity:1}.toast:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
@media (prefers-reduced-motion:reduce){*{transition-property:opacity,color,background-color,border-color!important;animation:none!important}}
</style></head><body>

const rbar=n=>`<div style="display:flex;gap:6px;margin-bottom:8px">${[1,2,3,4,5].map(i=>`<i style="flex:1;height:5px;border-radius:3px;background:${i<n?'#1F6B54':i===n?'#FF6A00':'#E2E8E4'}"></i>`).join('')}</div><div class="sm" style="margin-bottom:12px">Step ${n} of 5</div>`;
R['r-dev']=()=>`${rhead}<div style="max-width:420px;margin:20px auto;padding:0 16px">${rbar(2)}<h1 class="h2" style="font-size:26px">Test your device</h1><p class="mut" style="margin-bottom:12px">We will ask to use your camera and microphone, only for this test and the interview.</p><div class="vid" style="aspect-ratio:16/9;margin-bottom:12px"></div>${[['Camera','Working'],['Microphone','Working'],['Speaker','Played'],['Network','Working']].map(r=>`<div style="border:2px solid var(--green);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;margin-bottom:8px"><b>${r[0]}</b><b style="color:var(--green)">${r[1]}</b></div>`).join('')}<div style="display:flex;gap:var(--e);margin:12px 0">${bt('Play a sound')}${bt('Test again')}</div><button class="bt p" style="width:100%;justify-content:center;height:48px;border-radius:24px">Continue</button></div>`;
R['r-con']=()=>`${rhead}<div style="max-width:420px;margin:20px auto;padding:0 16px">${rbar(3)}<div class="card"><h1 class="h2" style="font-size:24px">Before we start</h1><p class="mut" style="font-size:13px;line-height:1.7">Client observers may listen silently and you will not see them. Your information is stored on secure servers in Singapore and is accessed by our team in China, where we apply protections comparable to those required in Singapore. It is deleted 180 days after the research project ends. You may withdraw your consent at any time by contacting the team.</p><div class="fld" style="margin-top:12px"><label>Country or region you are in now</label><div class="sel" style="width:100%;height:40px;justify-content:space-between">新加坡 (SG) ${ic('chev',14)}</div></div>${['I agree to video and audio recording','I understand client observers may listen silently','I agree to my data being stored in Singapore and accessed by the team in China (separate consent)'].map(t=>`<label style="display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line2)"><input type="checkbox" checked style="accent-color:#FF6A00;width:18px;height:18px;flex:none;margin-top:3px"><span>${t}</span></label>`).join('')}<button class="bt p" style="width:100%;justify-content:center;height:48px;border-radius:24px;margin-top:12px">Agree and continue</button><p class="sm" style="margin-top:12px">If you do not agree, simply close this page. Nothing happens.</p></div></div>`;
R['r-room']=()=>`${rhead}<div style="max-width:880px;margin:16px auto;padding:0 16px"><div style="display:grid;grid-template-columns:3fr 1fr;gap:12px"><div class="vid" style="aspect-ratio:16/9"><span>Moderator</span></div><div style="display:grid;gap:12px"><div class="vid"><span>You</span></div><div class="card w sm" style="padding:12px">The interview is being recorded. Observers may listen silently.</div></div></div><div style="display:flex;gap:var(--e);justify-content:center;margin-top:16px">${bt('Mic')}${bt('Camera')}${bt('Emoji')}${bt('Leave','dg')}</div></div>`;
/* ================= router ================= */
const GL=['projects','library','team','retention','audit'];
const NAVW=[['grid','全部项目','projects'],['library','研究库','library']],NAVW2=[['users','团队','team'],['clock','数据保留','retention'],['file','审计日志','audit']];
const WZ=['wizard1','wizard2','wizard3','wizard4','wizard5','wizard6','wizard7','wizardL'],OV=['ov','mon','pool','mem'],SC=['sf','sl'],IN=['in-data','in-rep','in-ask','in-clips','in-chat'];
const STAGE=[...SC,'gd','lv',...IN,'as'];
const TABS_OV=[['总览','ov'],['执行监控','mon'],['洞察池','pool'],['项目成员','mem']];
const TABS_ST=[['甄别设定','sf'],['访谈','gd'],['直播间','lv'],['洞察与片段','in-data'],['异步研究','as']];
const SUBS={sc:[['招募问卷','sf'],['配额与受访者名单','sl']],in:[['受访者数据','in-data'],['报告','in-rep'],['问题分析','in-ask'],['精彩片段','in-clips'],['对话','in-chat']]};
const tabOf=r=>SC.includes(r)?'sc':IN.includes(r)?'in':r;
function railHTML(r){
 const wide=GL.includes(r);
 const act=GL.includes(r)?r:WZ.includes(r)?'setup':OV.includes(r)?'ov':r==='quant'?'q':r==='listen'?'l':'s1';
 if(wide)return `<div class="logo">${LOGO}</div>`+NAVW.map(n=>`<div class="nav ${n[2]===r?'on':''}" data-r="${n[2]}">${ic(n[0])}<span>${n[1]}</span></div>`).join('')+`<div class="grp">设置</div>`+NAVW2.map(n=>`<div class="nav ${n[2]===r?'on':''}" data-r="${n[2]}">${ic(n[0])}<span>${n[1]}</span></div>`).join('')+`<span class="sp"></span><div class="me">Acme 出海<br><b style="color:#fff">王总</b> · 管理员<div style="margin-top:8px"><span class="bt" style="width:100%;justify-content:center;background:transparent;color:#fff;border-color:rgba(255,255,255,.3)" data-r="login">退出</span></div></div>`;
 const it=(k,i,l,rt,num)=>`<div class="nav ${act===k?'on':''}" data-r="${rt}">${num?`<span class="num">${num}</span>`:ic(i)}<span>${l}</span></div>`;
 return `<div class="logo">${LOGO}</div>`+it('p','grid','全部项目','projects')+it('p2','library','研究库','library')+it('setup','setup','立项向导','wizard1')+it('ov','gauge','项目总览','ov')+it('s1','','深访','sf',1)+it('s2','','座谈会','sf',2)+it('q','','定量','quant',3)+it('a','spark','异步 AI 研究','as')+it('l','pie','舆情采集','listen')+it('t','users','团队','team')+it('r','clock','数据保留','retention')+it('au','file','审计日志','audit')+`<span class="sp"></span><div class="nav" data-r="login"><span>退出</span></div>`;}
function place(el){const on=$('.on',el),ind=$('.ind',el);if(!on||!ind)return;ind.style.transform=`translateX(${on.offsetLeft}px)`;ind.style.width=on.offsetWidth+'px';}
function chrome(r){
 const proj=!GL.includes(r);
 $('#bar').classList.toggle('hide',!proj);
 if(proj){const m=r==='quant'?3:r==='listen'?0:1;
  $('#bar').innerHTML=`<span class="id">2026P001</span><b>${PR.name}</b>${tg('进行中','g')}<span class="mut">子项目</span><span class="sel">S1 英国 ${ic('chev',14)}</span><span class="mut">先深访，后定量</span><span class="step ${m===1?'on':'done'}"><i>${m>1?'✓':'1'}</i>深访</span><span class="stl"></span><span class="step ${m===3?'on':''}"><i>2</i>定量</span><span class="sp"></span>${tg('定量','sq')}${tg('深访','sq')}${tg('舆情','sq')}${bt('结项','sm')}`;}
 const showOv=OV.includes(r),showT=STAGE.includes(r);
 const tabs=showOv?TABS_OV:showT?TABS_ST:null;
 $('#tabs').classList.toggle('hide',!tabs);
 if(tabs){$$('#tabs span').forEach(s=>s.remove());const cur=showOv?r:tabOf(r)==='sc'?'sf':tabOf(r)==='in'?'in-data':r;tabs.forEach(t=>{const s=document.createElement('span');s.textContent=t[0];if(t[1]===cur)s.className='on';s.onclick=()=>go(t[1]);$('#tabs').appendChild(s);});}
 const subs=showT?SUBS[tabOf(r)]:null;$('#sub').classList.toggle('hide',!subs);
 if(subs){$$('#sub span').forEach(s=>s.remove());subs.forEach(t=>{const s=document.createElement('span');s.textContent=t[0];if(t[1]===r)s.className='on';s.onclick=()=>go(t[1]);$('#sub').appendChild(s);});}
 requestAnimationFrame(()=>{place($('#tabs'));place($('#sub'));});}
function chatWire(){const b=$('#csend');if(!b)return;const go=()=>{const i=$('#cin'),v=i.value.trim();if(!v)return;const m=$('#msgs');m.insertAdjacentHTML('beforeend',`<div class="bub me in">${v.replace(/</g,'&lt;')}</div>`);i.value='';m.scrollTop=m.scrollHeight;setTimeout(()=>{m.insertAdjacentHTML('beforeend','<div class="bub ai in">收到。这是演示：真实页面里，AI 会在这里回答，或改动右边的内容并出一张可撤销的变更卡。</div>');m.scrollTop=m.scrollHeight;},500);};b.onclick=go;$('#cin').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go();}};}
function wire(r){
 $$('#page .pill').forEach(p=>p.onclick=()=>{const par=p.parentElement;const multi=par.querySelectorAll('.pill').length>0&&(r==='wizard1'||r==='ov');if(multi)p.classList.toggle('on');else{$$('.pill',par).forEach(x=>x.classList.remove('on'));p.classList.add('on');}});
 $$('#page .seg').forEach(s=>$$('span',s).forEach(x=>x.onclick=()=>{$$('span',s).forEach(y=>y.classList.remove('on'));x.classList.add('on');}));
 $$('#page table.t tr.r').forEach(t=>t.onclick=e=>{if(e.target.closest('button,a,input,.lk'))return;$$('tr.r',t.parentElement).forEach(x=>x.classList.remove('on'));t.classList.add('on');});
 $$('#page .card.press').forEach(c=>{if(!c.closest('.chatc')&&!['projects'].includes(r))c.onclick=()=>c.classList.toggle('on');});
 $$('#page button.bt').forEach(b=>{if(b.classList.contains('p')&&!b.closest('.comp'))b.addEventListener('click',()=>toast('演示：这里会执行“'+b.textContent.trim()+'”'));});
 $$('#page [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 chatWire();}
let cur=null;
function go(r){if(!R[r])r='projects';if(location.hash!=='#'+r)history.replaceState(null,'','#'+r);const pg=$('#page');
 const doit=()=>{cur=r;const bare=['login','room','r-dev','r-con','r-room'].includes(r);$('#shell').classList.toggle('bare',bare);$('#shell').classList.toggle('wide',GL.includes(r));
  if(bare){$('#rail').innerHTML='';$('#bar').classList.add('hide');$('#tabs').classList.add('hide');$('#sub').classList.add('hide');}else{$('#rail').innerHTML=railHTML(r);$$('#rail [data-r]').forEach(n=>n.onclick=()=>go(n.dataset.r));chrome(r);}
  pg.innerHTML=R[r]();wire(r);window.scrollTo(0,0);pg.classList.remove('out');};
 if(cur===null||matchMedia('(prefers-reduced-motion: reduce)').matches){doit();return;}
 pg.classList.add('out');setTimeout(doit,120);}
addEventListener('hashchange',()=>go(location.hash.slice(1)));
addEventListener('load',()=>go(location.hash.slice(1)||'projects'));
</script></body></html>
