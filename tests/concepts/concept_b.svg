<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="概念 B：即时水光精华">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6FBFA"/><stop offset="1" stop-color="#DCEFEC"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2A9D8F"/><stop offset="1" stop-color="#0B5D63"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif">
    <text x="80" y="96" font-size="30" letter-spacing="6" fill="#0B5D63">概念 B</text>
    <text x="80" y="210" font-size="88" font-weight="700" fill="#0A3B40">即时水光精华</text>
    <text x="80" y="276" font-size="40" fill="#2A9D8F">上脸就饱满，白天妆前也好用</text>
    <line x1="80" y1="318" x2="640" y2="318" stroke="#2A9D8F" stroke-width="2"/>
    <g font-size="34" fill="#16444A">
      <text x="80" y="388">·  轻盈水感质地，3 秒推开不黏腻</text>
      <text x="80" y="450">·  小分子玻尿酸，多重补水，上脸即感饱满</text>
      <text x="80" y="512">·  30ml 一瓶，早晚各一次，可叠加面霜</text>
    </g>
    <rect x="80" y="560" width="420" height="72" rx="36" fill="none" stroke="url(#teal)" stroke-width="3"/>
    <text x="112" y="608" font-size="34" fill="#0A3B40">建议零售价 ¥ 259 / 30ml</text>
    <text x="80" y="682" font-size="22" fill="#5E8A8D">虚拟概念，仅用于访谈测试，不代表真实产品信息</text>
  </g>
  <g transform="translate(900 150)">
    <ellipse cx="130" cy="430" rx="150" ry="22" fill="#0A3B40" opacity=".18"/>
    <rect x="112" y="20" width="36" height="46" rx="6" fill="url(#teal)"/>
    <rect x="96" y="60" width="68" height="22" rx="6" fill="#0A3B40"/>
    <path d="M86 90h88c10 0 18 8 18 18v270c0 14-12 26-26 26H94c-14 0-26-12-26-26V108c0-10 8-18 18-18z" fill="#FFFFFF" stroke="#2A9D8F" stroke-width="3"/>
