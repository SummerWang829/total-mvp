    <text x="130" y="200" font-size="24" text-anchor="middle" fill="#0A3B40" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">即时水光</text>
    <text x="130" y="236" font-size="18" text-anchor="middle" fill="#2A9D8F" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">精华 30ml</text>
