# LiveKit for the test server. The key/secret come from the LIVEKIT_KEYS environment variable (see docker-compose.yml), not from this file.
port: 7880
# Signalling (7880) listens on all interfaces so Caddy's container can reach it through the Docker bridge.
# It is NOT exposed to the internet: the Tencent Cloud firewall does not open 7880 (only 80/443/7881/50000-50200).
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  # The server sits behind the cloud's 1:1 NAT (private 10.x address). Tell LiveKit its public IP explicitly instead of guessing it via STUN
  # (the guess logged "could not validate external IP"). CHANGE THIS if the server or its public IP changes.
  use_external_ip: false
  node_ip: 43.160.208.195
webhook:
  api_key: totalkey    # must equal LIVEKIT_API_KEY in deploy/.env (LiveKit does not expand variables in this file)
  urls:
    - http://127.0.0.1:8000/api/public/livekit/webhook
room:
  empty_timeout: 300
logging:
  level: info          # shows joins, leaves and connection quality while we are still testing; set back to warn later
