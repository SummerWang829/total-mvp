# Local LiveKit for development. Started by scripts/dev.sh (the webhook port is filled in there).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false
keys:
  devkey: devsecret-devsecret-devsecret-0000
webhook:
  api_key: devkey
  urls:
    - http://127.0.0.1:8000/api/public/livekit/webhook
room:
  empty_timeout: 300
logging:
  level: warn
