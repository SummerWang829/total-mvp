name: qa

# Every push and pull request runs the same checks the team runs by hand before anything is reported done: scripts/qa.sh
# (logic tests, whole-site browser checks, a real video interview in three browsers, the one-command start).
# Nothing is deployed from here: deployment stays a deliberate manual step (see deploy/README.md).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          bash scripts/get_livekit.sh
          sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run the checks
        run: bash scripts/qa.sh
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            qa_report.md
            qa_shots/
          retention-days: 7
