const box = $("#box"), enc = encodeURIComponent(t);

        name: "உங்கள் பெயர்", email: "உங்கள் மின்னஞ்சல்", country: "நாடு அல்லது பகுதி", agree: "மேலே உள்ள அறிவிப்பைப் படித்தேன்; இந்த நோக்கத்திற்காக என் விவரங்களைச் சேமிக்க ஒப்புக்கொள்கிறேன்.", submit: "சமர்ப்பி", doneT: "நன்றி!", done: "உங்கள் விவரங்கள் எங்களுக்குக் கிடைத்தன. இந்தப் பக்கத்தை மூடலாம்.",
        closed: "இந்தக் கேள்வித்தாள் மூடப்பட்டுள்ளது. நன்றி!", bad: "இந்த இணைப்பு செல்லாது", err: "அனுப்ப முடியவில்லை. படிவத்தைச் சரிபார்த்து மீண்டும் முயலவும்.", need: "உங்கள் பெயர், மின்னஞ்சலை நிரப்பி, பெட்டியைக் குறிக்கவும்." },
};
const T2 = {   // the system's own questions after the research team's: interview languages and formats (then the times)
  en: { prefT: "Two more questions", prefHint: "Pick as many as you like. The first one you tick is the one we will try first; the others are backups.", langQ: "Which language(s) would you like the interview in?", fmtQ: "How would you like to take part?", needL: "Please choose at least one language.", needF: "Please choose at least one way to take part." },
  zh: { prefT: "还有两个问题", prefHint: "可以多选。最先勾选的是我们优先安排的，其余作为备选。", langQ: "你希望用哪种语言进行访谈？", fmtQ: "你希望用哪种方式参加访谈？", needL: "请至少选一种语言。", needF: "请至少选一种参加方式。" },
  ms: { prefT: "Dua soalan lagi", prefHint: "Pilih seberapa banyak yang anda mahu. Yang pertama anda tandakan ialah yang kami cuba dahulu; yang lain ialah pilihan sandaran.", langQ: "Anda mahu temu bual dalam bahasa apa?", fmtQ: "Bagaimana anda mahu mengambil bahagian?", needL: "Sila pilih sekurang-kurangnya satu bahasa.", needF: "Sila pilih sekurang-kurangnya satu cara untuk mengambil bahagian." },
  ta: { prefT: "மேலும் இரண்டு கேள்விகள்", prefHint: "எத்தனை வேண்டுமானாலும் தேர்ந்தெடுக்கலாம். நீங்கள் முதலில் குறிப்பது முதலில் ஏற்பாடு செய்யப்படும்; மற்றவை மாற்று.", langQ: "எந்த மொழியில் நேர்காணல் வேண்டும்?", fmtQ: "எப்படிப் பங்கேற்க விரும்புகிறீர்கள்?", needL: "குறைந்தது ஒரு மொழியைத் தேர்ந்தெடுக்கவும்.", needF: "குறைந்தது ஒரு பங்கேற்பு முறையைத் தேர்ந்தெடுக்கவும்." },
};
for (const k in T2) Object.assign(T[k], T2[k]);
// ms / ta wording is first-draft: it needs a native speaker's and legal's review before real use (the project's language card marks it 文案待复核).
const NATIVE = { zh: "中文", en: "English", ms: "Bahasa Melayu", ta: "தமிழ்" }, HL = { zh: "zh-CN", en: "en", ms: "ms", ta: "ta" };
/** The language to open in: the browser's own when the questionnaire offers it, else the project's default. */
const pickLang = (offered, def) => { for (const l of navigator.languages || [navigator.language || ""]) { const c = String(l).toLowerCase().slice(0, 2); if (offered.includes(c)) return c; } return offered.includes(def) ? def : offered[0]; };

const COUNTRY = { SG: "Singapore / 新加坡", MY: "Malaysia / 马来西亚", ID: "Indonesia / 印尼", TH: "Thailand / 泰国", VN: "Vietnam / 越南", PH: "Philippines / 菲律宾" };
const post = async (path, body) => {
  const r = await fetch(`/api/public/screen/${enc}${path}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(typeof j.detail === "string" ? j.detail : "error"); e.status = r.status; throw e; }
  return j;
};
const fill = (s, info) => s.replace("{org}", info.org).replace("{days}", info.retention_days).replace("{dpo}", info.dpo);

(async () => {
  let info, x;
  try { info = await (await fetch(`/api/public/screen/${enc}`)).json(); if (!info.org) throw 0; } catch { box.innerHTML = `<h1>${T.en.bad} / ${T.zh.bad}</h1>`; return; }
  const offered = (info.languages && info.languages.length ? info.languages.map((l) => l.code) : [info.language || "en"]).filter((c) => T[c]);
  let lang = pickLang(offered, info.language); x = T[lang]; document.documentElement.lang = HL[lang];
  let redraw = () => {};   // draws the screen the candidate is on again, after they change the language
  if (offered.length > 1) {
    const bar = document.createElement("div"); bar.className = "lgbar";
    bar.innerHTML = `<label><span class="vh">Language</span><select id="lgsel" aria-label="Language">${offered.map((c) => `<option value="${c}"${c === lang ? " selected" : ""}>${NATIVE[c]}</option>`).join("")}</select></label>`;
    box.parentElement.insertBefore(bar, box);
    $("#lgsel").onchange = (e) => { lang = e.target.value; x = T[lang]; document.documentElement.lang = HL[lang]; runnerLang(); const it = $("#introtxt"); if (it) it.innerHTML = introHtml(); redraw(); };
  }
  let runnerLang = () => {};
  if (!info.open) { box.innerHTML = `<h1>${x.closed}</h1>`; return; }
  const introHtml = () => `<h1>${x.title}</h1><p>${esc(fill(x.intro, info))}</p><div class="note">${esc(fill(x.notice, info))}</div>`;   // kept apart so it follows a language change while the questions are on screen
  const drawIntro = () => { box.innerHTML = `<div id="introtxt" class="swrap" style="padding:0">${introHtml()}</div><div><button class="p" id="scrgo" type="button">${x.start}</button></div><div id="q"></div>`; $("#scrgo").onclick = start; redraw = drawIntro; };
  const start = () => {
    $("#scrgo").parentElement.remove();
    const host = $("#q");
    const prefs = { langs: [], formats: [] };   // what they chose in the two system questions, in the order they ticked (the first one is the preferred one)
    const showPrefs = (answers) => {
      redraw = () => showPrefs(answers);
      const Ls = info.interview_languages || [], Fs = info.formats || [];
      if (!Ls.length && !Fs.length) { showSlots(answers); return; }
      const group = (id, title, list, name, cur, label) => `<fieldset class="slotday"><legend>${esc(title)}</legend><div class="slots">${list.map((o) => `<label class="slot${cur.includes(o.code) ? " on" : ""}"><input type="checkbox" name="${name}" value="${o.code}"${cur.includes(o.code) ? " checked" : ""}><span>${esc(label(o))}</span></label>`).join("")}</div></fieldset>`;
      host.innerHTML = `<h2>${x.prefT}</h2><p class="sm">${x.prefHint}</p><form id="pf" class="stack">
        ${Ls.length ? group("l", x.langQ, Ls, "l", prefs.langs, (o) => NATIVE[o.code] || o.name) : ""}${Fs.length ? group("f", x.fmtQ, Fs, "f", prefs.formats, (o) => (lang === "zh" ? o.name : o.en)) : ""}
        <div class="note" id="perr" role="alert" hidden></div><div><button class="p" type="submit">${x.next}</button></div></form>`;
      const f = $("#pf");
      f.querySelectorAll("input[type=checkbox]").forEach((c) => (c.onchange = () => {
        const list = c.name === "l" ? prefs.langs : prefs.formats, at = list.indexOf(c.value);
        if (c.checked && at < 0) list.push(c.value); else if (!c.checked && at >= 0) list.splice(at, 1);
        c.closest(".slot").classList.toggle("on", c.checked);
      }));
      f.onsubmit = (e) => {
        e.preventDefault(); const er = $("#perr");
        if (Ls.length && !prefs.langs.length) { er.textContent = x.needL; er.hidden = false; return; }
        if (Fs.length && !prefs.formats.length) { er.textContent = x.needF; er.hidden = false; return; }
        showSlots(answers);
      };
    };
    const showContact = (answers, picks) => {
      redraw = () => showContact(answers, picks);
      host.innerHTML = `<h2>${x.okT}</h2><p>${x.ok}</p><form id="cf" class="stack"><label class="f"><span>${x.name}</span><input name="name" maxlength="100" autocomplete="name" required></label>
        <label class="f"><span>${x.email}</span><input name="email" type="email" maxlength="200" autocomplete="email" required></label>
        <label class="f"><span>${x.country}</span><select name="country">${info.countries.map((c) => `<option value="${c}">${esc(COUNTRY[c] || c)}</option>`).join("")}</select></label>
        <label class="chk"><input type="checkbox" name="consent" required><span>${x.agree}</span></label><div class="note" id="cerr" role="alert" hidden></div><div><button class="p" type="submit">${x.submit}</button></div></form>`;
      $("#cf").onsubmit = async (e) => {
        e.preventDefault(); const f = e.target, err = $("#cerr");
        if (!f.consent.checked || !f.name.value.trim() || !f.email.value.trim()) { err.textContent = x.need; err.hidden = false; return; }
        try { await post("/submit", { answers, name: f.name.value, email: f.email.value, country: f.country.value, consent: true, slots: picks, langs: prefs.langs, formats: prefs.formats }); redraw = () => { host.innerHTML = `<h2>${x.doneT}</h2><p>${x.done}</p>`; }; redraw(); }
        catch (er) { err.textContent = er.status === 403 || er.status === 422 || er.status === 429 ? er.message : x.err; err.hidden = false; }
      };
    };
    const showSlots = async (answers) => {   // the last question is added by the system: which interview times suit you
      redraw = () => showSlots(answers);
      let days = [];
      try { days = (await (await fetch(`/api/public/screen/${enc}/slots`)).json()).days || []; } catch { days = []; }
      if (!days.length) { showContact(answers, []); return; }
      const names = x.days, ofDay = (d) => { const [, m, dd] = d.date.split("-"); return `${names[days.indexOf(d)] || ""} ${Number(m)}/${Number(dd)} ${x.wk[d.weekday]}`; };
      host.innerHTML = `<h2>${x.slotsT}</h2><p class="sm">${x.slotsHint}</p><form id="sf" class="stack">${days.map((d) => `<fieldset class="slotday"><legend>${esc(ofDay(d))}</legend><div class="slots">${d.times.map((tm) => `<label class="slot"><input type="checkbox" name="s" value="${esc(tm.at)}"><span>${tm.hhmm}</span></label>`).join("")}</div></fieldset>`).join("")}
        <label class="chk"><input type="checkbox" name="none"><span>${x.none}</span></label><div class="sm" id="sc" role="status">&nbsp;</div><div class="note" id="serr" role="alert" hidden></div><div><button class="p" type="submit">${x.next}</button></div></form>`;
      const f = $("#sf"), count = () => { const n = f.querySelectorAll("input[name=s]:checked").length; $("#sc").textContent = n ? x.picked.replace("{n}", n) : "\u00a0"; };
      f.querySelectorAll("input[name=s]").forEach((c) => (c.onchange = () => { if (c.checked) f.none.checked = false; c.closest(".slot").classList.toggle("on", c.checked); count(); }));
      f.none.onchange = () => { if (f.none.checked) f.querySelectorAll("input[name=s]").forEach((c) => { c.checked = false; c.closest(".slot").classList.remove("on"); }); count(); };
      f.onsubmit = (e) => {
        e.preventDefault(); const picks = [...f.querySelectorAll("input[name=s]:checked")].map((c) => c.value);
        if (!picks.length && !f.none.checked) { const er = $("#serr"); er.textContent = x.pick1; er.hidden = false; return; }
        showContact(answers, picks);
      };
    };
    const runner = scrRunner(host, {
      lang, step: (answers) => post("/step", { answers, lang }).catch((e) => { throw new Error(e.status === 410 ? x.closed : e.message); }),
      onEnd: (result, answers) => {
        if (result === "out") { redraw = () => { host.innerHTML = `<h2>${x.outT}</h2><p>${x.out}</p>`; }; redraw(); return; }
        showPrefs(answers);
      },
    });
    runnerLang = () => runner.setLang(lang); redraw = () => runner.redraw();
    runner.start();
  };
  drawIntro();
})();
</script></body></html>
