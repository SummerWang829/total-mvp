let T = I18N.zh;                      // staff always see Chinese; participants get their interview's language after entering
const $id = (x) => document.getElementById(x);
const msg = (h) => ($id("msg").innerHTML = h);
const bar = $id("bar"), grid = $id("grid");

// room colours: white light by default; dark green on request, remembered in this browser only (never sent anywhere)
function themeLabel() {
  const b = $id("theme"); b.textContent = document.body.classList.contains("t-dark") ? T.toLight : T.toDark;
  b.setAttribute("aria-label", `${T.themeName}: ${b.textContent}`);
}
$id("theme").onclick = () => {
  const dark = !document.body.classList.contains("t-dark");
  document.body.classList.toggle("t-dark", dark); document.body.classList.toggle("t-light", !dark);
  try { localStorage.setItem("tt_room_theme", dark ? "dark" : "light"); } catch (e) {}
  themeLabel();
};
themeLabel();
let room = null, S = null, role = null, ended = false, localTracks = [], camTrack = null, micTrack = null;

// ---- emoji: a quick row, and the full panel (search, categories, skin tones, recents) like a phone keyboard; all files come from our own server ----
const QUICK = [["like", "👍"], ["love", "❤️"], ["smile", "😊"], ["laugh", "😂"], ["surprise", "😮"], ["confused", "😕"], ["sad", "😢"], ["dislike", "👎"]];
function closeEmoji() { EmojiPanel.close(); }
function openEmoji(onPick, { quick, anchor, toggle, stay }) {   // quick: the row of eight reactions on top (a reaction); stay: keep the panel open while inserting into a message
  return EmojiPanel.open({ anchor, toggle, onPick, stay, lang: role === "participant" ? S.language || "en" : "zh", quick: quick ? QUICK.map(([k, g]) => [T.rx[k], g]) : null });
}
async function sendReaction(glyph) {
  try {
    const r = await fetch(`/api/public/join/${encodeURIComponent(inviteT)}/reaction`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ emoji: glyph }) });
    toast(r.ok ? `${glyph} ${T.rxSent}` : r.status === 429 ? T.rxSlow : T.rxWait);
  } catch { toast(T.rxWait); }
}
function buildReactionButton() {  // a participant can send an emoji at any moment; the team sees it with the time and the material on screen
  const b = addBtn("b-react", T.react, async () => { if (EmojiPanel.isOpen()) closeEmoji(); else openEmoji(sendReaction, { quick: true, anchor: b, toggle: b }); });
  b.setAttribute("aria-haspopup", "true"); b.setAttribute("aria-expanded", "false");
}
function addBtn(id, label, fn, cls = "") {
  const b = document.createElement("button"); b.id = id; b.textContent = label; if (cls) b.className = cls;
  if (id.startsWith("b-") && ["b-start", "b-rec", "b-stop", "b-end"].includes(id)) b.dataset.polled = "1";  // enabled/disabled by the live state, not by the click
  b.onclick = guard(async () => { b.disabled = true; try { await fn(b); } finally { if (!b.dataset.polled) b.disabled = false; await poll(); } }); bar.appendChild(b); return b;
}
function tile(id, name) {
  let el = document.getElementById("t_" + id);
  if (!el) {
    el = document.createElement("div"); el.className = "tile"; el.id = "t_" + id; el.innerHTML = `<div class="nm"></div><div class="off" hidden></div>`;
    const slot = Q4.on ? $id(String(id).startsWith("participant:") ? "c2t" : "c1t") : null;   // four-column room: me and the moderator on the left, the participant in the middle
    (slot || grid).appendChild(el);
  }
  $(".nm", el).textContent = name; return el;
}
function setTileVideo(el, track) { el.querySelectorAll("video").forEach((v) => v.remove()); const v = track.attach(); v.setAttribute("playsinline", ""); el.prepend(v); }

// ---------------- recording: this browser records ITS OWN camera+mic and uploads chunks ----------------
const R = { mr: null, id: null, seq: 0, q: Promise.resolve(), offset: 0, bad: 0, mime: "", part: Math.random().toString(36).slice(2, 10) };  // a page reload gets a new "part", so a refresh mid-recording never corrupts the earlier part
const authHdr = () => (inviteT ? {} : { Authorization: "Bearer " + (store.get("tt_token") || "") });
const chunkUrl = (rid) => inviteT ? `/api/public/join/${encodeURIComponent(inviteT)}/recording/${rid}/chunk` : `/api/interviews/${iid}/recording/${rid}/chunk`;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function pickMime(hasVideo) {
  const c = hasVideo ? ["video/webm;codecs=vp8,opus", "video/webm;codecs=vp9,opus", "video/webm", "video/mp4"] : ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
  return c.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}
async function post(rid, seq, offset, blob, last, mime) {
  const part = R.part;
  for (let a = 0; a < 6; a++) {
    try {
      const r = await fetch(`${chunkUrl(rid)}?seq=${seq}&offset_ms=${offset}&last=${last ? 1 : 0}&part=${part}`, { method: "POST", headers: { ...authHdr(), "Content-Type": mime.split(";")[0] }, body: blob, keepalive: blob.size < 60000 });
      if (r.ok) { R.bad = 0; return; }
      if (r.status >= 400 && r.status < 500 && r.status !== 429) { return; }  // recording already finished or not allowed: retrying will not help
    } catch {}
    R.bad++; showWarn(true); await sleep(800 * 2 ** a);
  }

const LIVE = { on: false, busy: false, retryAt: 0, mic: null, cam: null, nameOf: null, reconnecting: false };
async function swapToken() {   // a token that matches who may publish now; join the video room again with it
  const t = await api(`/interviews/${iid}/token`, { method: "POST", body: asRole ? { as: asRole } : {} });
  LIVE.reconnecting = true;
  try {
    await room.disconnect(); await room.connect(t.url || S.url, t.token); S.view_only = t.view_only;
    room.remoteParticipants.forEach((p) => tile(p.identity, LIVE.nameOf(p)));
  } finally { LIVE.reconnecting = false; }
}
function dropHuman() {
  ["mic", "cam"].forEach((k) => { if (LIVE[k]) { try { LIVE[k].stop(); } catch {} LIVE[k] = null; } });

function humanButtons() {

      try { await run(want); } catch (e) { toast(want ? "没有打开成功：请允许浏览器使用设备" : "没有关闭成功", true); return; }
      b.setAttribute("aria-pressed", String(want)); b.textContent = want ? off : on;

async function humanMedia(on) {   // called with every poll: idempotent
  if (!room || LIVE.busy || on === LIVE.on || Date.now() < LIVE.retryAt) return;

    if (on) { await swapToken(); LIVE.on = true; humanButtons(); }

  } catch { LIVE.retryAt = Date.now() + 15000; toast("视频连接没有切换成功，稍后会再试", true); } finally { LIVE.busy = false; }
}

function participantMarks(s, wrap, im, pins) {
  const base = `/api/public/join/${encodeURIComponent(inviteT)}/stimulus/${s.id}`;
  let kind = "like";
  const tools = document.createElement("div"); tools.className = "marktools";
  tools.innerHTML = `<span class="mkhint">${esc(T.markHint)}</span><div class="mkbtns">` +
    `<button type="button" class="mk like on" data-k="like">♥ ${esc(T.markLike)}</button>` +
    `<button type="button" class="mk dislike" data-k="dislike">✕ ${esc(T.markDislike)}</button></div>`;
  $id("stim").appendChild(tools);

  const remove = async (m) => { try { await fetch(`${base}/mark/${m.id}`, { method: "DELETE" }); } catch {} await load(); };
  const draw = (marks) => { pins.textContent = ""; marks.forEach((m) => pins.appendChild(markPin(m, remove))); };
  async function load() { try { const r = await fetch(`${base}/marks`); if (r.ok) draw((await r.json()).marks); } catch {} }

// ---------------- live captions: this browser streams ITS OWN microphone to the speech recogniser ----------------
// The server hands out a short-lived signed address (the secret key never reaches the browser); finished sentences are then posted back,
// so the team sees both speakers, each sentence labelled by who spoke.
const CAP = { on: false, ws: null, ctx: null, tries: 0, stopping: false, partial: "", sentPartial: "", queue: [], busy: false, lv: [] };
const capApi = (p) => (inviteT ? `/api/public/join/${encodeURIComponent(inviteT)}/${p}` : `/api/interviews/${iid}/${p}`);
const PCM_WORKLET = [  // 16 kHz 16-bit mono, 200 ms (3200 samples) per message
  "class P extends AudioWorkletProcessor{",
  "constructor(){super();this.o=[];this.acc=0;this.cnt=0;this.pos=0;this.ratio=sampleRate/16000;}",
  "process(inp){const c=inp[0]&&inp[0][0];if(!c)return true;",
  "for(let k=0;k<c.length;k++){this.acc+=c[k];this.cnt++;this.pos+=1;",
  "if(this.pos>=this.ratio){this.pos-=this.ratio;this.o.push(this.acc/this.cnt);this.acc=0;this.cnt=0;",
  "if(this.o.length>=3200){const b=new Int16Array(3200);for(let j=0;j<3200;j++){const s=Math.max(-1,Math.min(1,this.o[j]));b[j]=s<0?s*32768:s*32767;}this.o=[];this.port.postMessage(b.buffer,[b.buffer]);}}}",
  "return true;}}",
  "registerProcessor('pcm16',P);",
].join("\n");
const capStatus = (t) => { const e = $id("capst"); if (e) e.textContent = t; };
async function capFlush() {  // finished sentences, in order; a hiccup retries, a refusal (not live / no consent) drops the sentence
  if (CAP.busy) return; CAP.busy = true;
  while (CAP.queue.length) {
    try {
      const r = await fetch(capApi("captions"), { method: "POST", headers: { ...authHdr(), "Content-Type": "application/json" }, body: JSON.stringify(CAP.queue[0]) });
      if (r.ok || (r.status >= 400 && r.status < 500 && r.status !== 429)) CAP.queue.shift(); else await sleep(1000);
    } catch { await sleep(1000); }
    if (CAP.queue.length > 50) CAP.queue.splice(0, CAP.queue.length - 50);
  }
  CAP.busy = false;
}
function capLevel() {  // the average level (dBFS) of the speech since the last finished sentence, or undefined when there was none; then start over
  const v = CAP.lv; CAP.lv = [];
  return v.length >= 3 ? Math.round((v.reduce((a, b) => a + b, 0) / v.length) * 10) / 10 : undefined;
}
function capPost(text, dur) { CAP.partial = ""; CAP.sentPartial = ""; CAP.queue.push({ text, final: true, dur_ms: Math.max(0, Math.min(120000, Math.round(dur || 0))), vol_db: capLevel() }); capFlush(); }
setInterval(() => {  // the sentence being spoken: at most twice a second, only the latest
  if (!CAP.partial || CAP.partial === CAP.sentPartial || CAP.queue.length) return;
  CAP.sentPartial = CAP.partial;
  fetch(capApi("captions"), { method: "POST", headers: { ...authHdr(), "Content-Type": "application/json" }, body: JSON.stringify({ text: CAP.partial, final: false }) }).catch(() => {});
}, 500);
async function capAudio() {
  if (CAP.ctx) return;
  let ctx; try { ctx = new AudioContext({ sampleRate: 16000 }); } catch { ctx = new AudioContext(); }  // Safari ignores the requested rate: the worklet resamples
  CAP.ctx = ctx;
  const resume = () => { if (ctx.state === "suspended") ctx.resume().catch(() => {}); };
  ["pointerdown", "keydown", "touchstart"].forEach((ev) => addEventListener(ev, resume, { passive: true })); resume();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([PCM_WORKLET], { type: "text/javascript" })));
  const node = new AudioWorkletNode(ctx, "pcm16");
  node.port.onmessage = (e) => {
    if (CAP.ws && CAP.ws.readyState === 1) CAP.ws.send(e.data);
    const pcm = new Int16Array(e.data); let sum = 0; for (let i = 0; i < pcm.length; i++) sum += pcm[i] * pcm[i];
    const db = 20 * Math.log10(Math.sqrt(sum / pcm.length) / 32768 + 1e-9);   // level of this 200 ms frame; silence is left out, a muted microphone gives nothing
    if (db > -60) { CAP.lv.push(db); if (CAP.lv.length > 600) CAP.lv.shift(); }
  };
  // the page's own microphone track (muting the mic in the room also silences the captions); not connected to the speakers, so no echo
  ctx.createMediaStreamSource(new MediaStream([micTrack.mediaStreamTrack])).connect(node);
}
function capRetry() {
  if (ended || !CAP.on || CAP.stopping) return;
  if (++CAP.tries > 8) { capStatus("字幕已断开，请刷新页面"); return; }
  capStatus("字幕重连中…"); setTimeout(capLoop, Math.min(1000 * 2 ** CAP.tries, 15000));
}
async function capLoop() {  // (re)connect, only while the interview is live
  if (ended || !CAP.on || CAP.stopping) return;
  if (!last || last.status !== "live") { setTimeout(capLoop, 2000); return; }
  let cfg;
  try { cfg = await (await fetch(capApi("asr"), { headers: authHdr() })).json(); } catch { return capRetry(); }
  if (!cfg.enabled) { capStatus(cfg.reason || "字幕未开启"); if (cfg.retry) setTimeout(capLoop, 3000); else CAP.on = false; return; }
  let ws; try { ws = new WebSocket(cfg.url); } catch { return capRetry(); }
  ws.binaryType = "arraybuffer"; CAP.ws = ws;
  ws.onopen = async () => { capStatus("字幕已开启：正在听你的麦克风"); try { await capAudio(); } catch (e) { capStatus("字幕无法使用麦克风"); } };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.code !== 0) { capStatus("字幕出错：" + (m.message || m.code)); return; }  // the recogniser then closes; we reconnect with a new voice id
    CAP.tries = 0;
    const r = m.result; if (!r || !r.voice_text_str) return;
    if (r.slice_type === 2) capPost(r.voice_text_str, r.end_time - r.start_time); else CAP.partial = r.voice_text_str;
  };
  ws.onclose = () => { if (CAP.ws === ws) { CAP.ws = null; capRetry(); } };
}
function capStart() { if (CAP.on || role === "observer" || C.on || !micTrack) return; CAP.on = true; capLoop(); }
function capStop() {
  CAP.stopping = true; CAP.on = false;
  try { if (CAP.ws && CAP.ws.readyState === 1) CAP.ws.send(JSON.stringify({ type: "end" })); if (CAP.ws) CAP.ws.close(); } catch {}
  if (CAP.ctx) { CAP.ctx.close().catch(() => {}); CAP.ctx = null; }  // release the audio thread
}

const CP = { after: 0 };
function chatBox(ta, form, send, extra) {

function addEmoji(ta) {   // an emoji button in a chat box of the team's room, before the send button
  const host = ta.closest(".qin"), box = ta.closest(".qbox"); if (!host || host.querySelector(".qemo")) return;

// ---- follow-up composer: click a line to quote it, then write what to dig into; the same state serves the caption panel and the AI room's conversation ----
const QQ = { items: [], depth: "shallow" }, QQ_MAX = 6;
function qqToggle(item) {
  const i = QQ.items.findIndex((x) => x.id === item.id);
  if (i >= 0) QQ.items.splice(i, 1);
  else if (QQ.items.length >= QQ_MAX) { toast(`最多引用 ${QQ_MAX} 句`); return; }
  else QQ.items.push(item);
  qqDraw();
}
function qqMake(el, item) {  // a line that can be clicked (or Enter / Space) to quote it; dragging to select text for copying does not quote
  el.dataset.qid = item.id; el.tabIndex = 0; el.setAttribute("role", "button"); el.setAttribute("aria-pressed", "false"); el.title = "点一下引用这句话";
  el.onclick = (e) => { if (e.target.closest("button, summary, details")) return; const s = getSelection(); if (s && s.toString().trim()) return; qqToggle(item); };
  el.onkeydown = (e) => { if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); qqToggle(item); } };
}
function qqDraw() {
  document.querySelectorAll("[data-qid]").forEach((e) => { const on = QQ.items.some((x) => x.id === e.dataset.qid); e.classList.toggle("qsel", on); e.setAttribute("aria-pressed", String(on)); });
  document.querySelectorAll("#qdepth button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.d === QQ.depth)));
  const box = $id("qq"); if (!box) return;
  box.textContent = "";
  QQ.items.forEach((x) => {
    const c = document.createElement("div"); c.className = "qqc";
    const s = document.createElement("span"); s.textContent = `${x.at != null ? mmss(x.at) + " " : ""}“${x.text}”`;
    const b = document.createElement("button"); b.type = "button"; b.textContent = "×"; b.setAttribute("aria-label", "取消引用这句话"); b.onclick = () => qqToggle(x);
    c.append(s, b); box.appendChild(c);
  });
  const h = $id("qqh"); if (h) h.hidden = QQ.items.length > 0;

  $id("olbody").addEventListener("click", (e) => { const x = e.target.closest(".qx"); if (!x) return; const k = x.dataset.qi; Q4.open.has(k) ? Q4.open.delete(k) : Q4.open.add(k); renderAssist(Q4.lastAssist); });

  }
  $id("pform").onsubmit = guard(async (e) => {
    e.preventDefault(); const ta = $id("pin"), text = ta.value.trim(); if (!text && !QQ.items.length) { toast("先点一句字幕，或写想深挖什么"); return; }
    const body = QQ.items.length ? { kind: "probe", caption_ids: QQ.items.map((x) => x.id), text, depth: QQ.depth } : { kind: "probe", text, depth: QQ.depth };
    await api(`/interviews/${iid}/highlights`, { method: "POST", body }); ta.value = ""; qqClear(); toast(role === "moderator" ? "已加入待追问" : "已发给主持人"); await pollProbes();
  });

  addReactionFeed($id("c3"));
  if (role === "moderator") { pollAssist(); Q4.timer = setInterval(pollAssist, 3000); }
  else { $id("olbody").innerHTML = `<p>大纲进度只给主持人看。</p>`; $id("talk").innerHTML = `<p>说话占比目前仅主持人可见。</p>`; $id("chap").innerHTML = `<p>章节要点目前仅主持人可见。</p>`; $id("sugg").innerHTML = ""; $id("sugh").hidden = true; }
}
function videoMode() {   // two pictures side by side, or one big with the other as a small window; click a picture to make it the big one, click the small window to swap
  const row = $id("qrow"); if (!row) return;
  let m = { mode: "split", swap: false }; try { Object.assign(m, JSON.parse(localStorage.getItem("room_vm") || "{}")); } catch {}
  const apply = () => { row.classList.toggle("big", m.mode === "big"); row.classList.toggle("swap", m.swap); row.querySelectorAll("#qvm button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.vm === m.mode))); try { localStorage.setItem("room_vm", JSON.stringify(m)); } catch {} };
  row.querySelectorAll("#qvm button").forEach((b) => (b.onclick = (e) => { e.stopPropagation(); m.mode = b.dataset.vm; apply(); }));
  row.addEventListener("click", (e) => {
    const tile = e.target.closest("#c1t, #c2t"); if (!tile || e.target.closest("#qvm")) return;
    const host = tile.id === "c1t";
    if (m.mode === "split") { m = { mode: "big", swap: host }; } else if (host !== m.swap) { m.swap = host; } else return;
    apply();
  });
  apply();
}
const QD = { none: "不追问", shallow: "轻问 1 个", deep: "深挖 2–3 个", free: "不限（1–3 个）" };
const olBar = (label, pct, color) => `<div class="qbar"><span>${label}</span><div><i style="width:${Math.min(100, pct || 0)}%;background:${color}"></i></div><span>${pct == null ? "—" : pct + "%"}</span></div>`;
function renderAssist(d) {
  Q4.lastAssist = d;
  if (!d.has_outline) { $id("olbody").innerHTML = `<p>项目还没有访谈大纲。到“访谈”页写好大纲，这里会显示进度。</p>`; $id("olcount").textContent = ""; }
  else {
    const o = d.outline; $id("olcount").textContent = `已覆盖 ${o.covered} / ${o.total}`;
    let n = -1, upto = 0; Q4.plan = null;
    $id("olbody").innerHTML = o.parts.map((p) => { upto += p.minutes; return p.questions.map((q, qi) => { n++; const cur = n === o.current; if (cur) Q4.plan = { planned: d.planned_min, name: p.title, endMs: upto * 60000 };
      const open = Q4.open.has(String(n)), guide = (q.guide || "").trim();
      return `<div class="qo ${q.covered ? "dn" : ""}${cur ? " now" : ""}"><i></i><span>${esc(q.text)}${qi === 0 ? `<small>${esc(p.title)} · 预算 ${p.minutes} 分钟</small>` : ""}</span><button type="button" class="qx" data-qi="${n}" aria-expanded="${open}" aria-label="${open ? "收起" : "展开"}这题的追问点">›</button>${open ? `<div class="qd"><small>追问点 · ${QD[q.depth] || QD.shallow}</small>${guide ? esc(guide) : `<span class="mut">没有写访谈指引</span>`}</div>` : ""}</div>`; }).join(""); }).join("")
      + (d.pacing && d.pacing.used_pct != null ? olBar("进度", d.pacing.covered_pct, "#1F6B54") + olBar("时间", d.pacing.used_pct, "#EF9F27") : "");
  }
  const t = d.talk, p = d.pacing;
  $id("talk").innerHTML = t.moderator_pct == null ? `<p>${last && last.status === "live" ? "说得还不够多，稍后显示" : "访谈开始后显示"}</p>`
    : `<div class="qbar"><span>主持 ${t.moderator_pct}%</span><div><i style="width:${t.moderator_pct}%;background:#9FC9B8"></i><i style="width:${t.participant_pct}%;background:#1F6B54"></i></div><span>受访 ${t.participant_pct}%</span></div>${t.advice ? `<div class="qwarn">${esc(t.advice)}</div>` : ""}`;
  if (p && p.advice) $id("talk").innerHTML += `<div class="qwarn" style="margin-top:6px">${esc(p.advice)}</div>`;
  const sug = d.probes.filter((x) => !Q4.later.has(x.key));
  $id("sugnote").textContent = sug.length ? "根据刚才的回答" : "";
  $id("sugg").innerHTML = sug.length ? sug.map((x) => `<div class="qsug" data-k="${esc(x.key)}"><small>“${esc(x.trigger)}”（${esc(x.rule)}）</small>${esc(x.question)}<div class="row"><button type="button" class="p" data-use>用这句</button><button type="button" data-later>稍后</button><button type="button" data-no>不合适</button></div></div>`).join("")
    : `<p class="sm" style="color:var(--r-mut)">${last && last.status === "live" ? "暂时没有要追问的地方" : "访谈开始后，这里根据受访者的回答给出追问建议；观察员提的追问也在下面的待追问里。"}</p>`;
  $id("sugg").querySelectorAll(".qsug").forEach((el) => {
    const k = el.dataset.k, q = sug.find((x) => x.key === k);
    el.querySelector("[data-use]").onclick = guard(async () => { await api(`/interviews/${iid}/highlights`, { method: "POST", body: { kind: "probe", text: q.question } }); Q4.asked.add(k); saveAsked2(); toast("已加入待追问"); await pollProbes(); pollAssist(); });
    el.querySelector("[data-later]").onclick = () => { Q4.later.add(k); renderAssist(d); };
    el.querySelector("[data-no]").onclick = () => { Q4.asked.add(k); saveAsked2(); pollAssist(); };
  });
  $id("chapnote").textContent = d.chapters && d.chapters.length ? `${d.chapters.length} 章已问完` : "";
  $id("chap").innerHTML = d.chapters && d.chapters.length ? d.chapters.map((c) => `<div style="margin:0 0 10px"><b>${esc(c.title)}</b>${c.points.map((x) => `<div class="qq">“${esc(x.text)}” <small>${mmss(x.at_ms)}</small></div>`).join("")}${c.unexpanded.length ? `<div class="qwarn">没展开：${c.unexpanded.map((u) => `“${esc(u)}”`).join("、")}</div>` : ""}</div>`).join("")
    : `<p>每章问完后，这里出本章要点（受访者的原话）和没展开的地方。</p>`;
}
async function pollAssist() {
  if (!Q4.on || ended || role !== "moderator") return;
  try { renderAssist(await api(`/interviews/${iid}/assist?asked=${encodeURIComponent([...Q4.asked].slice(-40).join(","))}`)); } catch {}
}

// ---------------- start ----------------
async function start() {
  msg(T.connecting);
  try {
    S = inviteT ? await api(`/public/join/${encodeURIComponent(inviteT)}/enter`, { method: "POST", auth: false })
      : await api(`/interviews/${iid}/token`, { method: "POST", body: asRole ? { as: asRole } : {} });
  } catch (e) { msg(`<b>${esc(T.cantEnter)}：</b>${esc(e.message)}`); return; }
  role = S.role;
  document.body.dataset.roomRole = role;
  document.body.classList.toggle("role-one-to-one", S.kind !== "group" && S.moderation !== "ai");
  if (role === "participant") { $id("q4").remove(); $id("brpop").remove(); }   // the team's four columns are not even in the participant's page
  if (role === "participant") { T = I18N[S.language] || I18N.en; document.documentElement.lang = S.language || "en"; document.body.classList.add("solo"); themeLabel(); }
  else if (S.kind !== "group") buildQ4();   // the four-column room
  else { $id("lpan").hidden = false; $id("rpan").hidden = false; }
  if (role === "moderator") {  // who is in the room (nobody has to let the participant in)
    $id("wbox").hidden = false;
    loadPretask();  // show the participant's pre-interview answers (both human and AI moderation)
  }
  if (S.moderation === "ai") {
    C.on = true;
    if (role === "participant") buildParticipantChat(); else buildAiPanel();
  } else if (role !== "participant" && Q4.on) {
    if (role === "moderator") loadPlan();  // the concept-test script and materials, when there are any (the panels were built with the four columns)
  } else if (role !== "participant") {
    buildCaptionPanel();  // human-moderated: live captions with quote / follow-up buttons
    if (S.kind === "group") buildFairnessPanel();  // a focus group: who has talked how much, who has been quiet
    if (S.kind === "group" && role === "moderator") buildCuePanel();  // and private cue cards for the moderator
    if (role === "moderator") loadPlan();  // the script and the materials
  }
  document.title = T.title + " · 星桐";
  $id("who").textContent = role === "participant" ? T.title : { moderator: "主持人", observer: "观察员（隐身）" }[role];
  if (role === "observer") msg(`你以<b>观察员</b>身份隐身进入：受访者看不到你，你不能发言，也不会出现在录制里。`);

  if (role === "moderator") {
    addBtn("b-start", "开始访谈", () => api(`/interviews/${iid}/start`, { method: "POST" }).then(() => toast("访谈已开始")), "p");
    addBtn("b-rec", "开始录制", () => api(`/interviews/${iid}/recording/start`, { method: "POST" }).then(() => toast("录制中")));
    addBtn("b-stop", "停止录制", () => api(`/interviews/${iid}/recording/stop`, { method: "POST" }).then(() => toast("已停止，正在合成录像")));
    addBtn("b-end", "结束访谈", async () => { if (confirm("结束后所有人会被移出，且不能再进入。")) { await api(`/interviews/${iid}/end`, { method: "POST" }); } }, "bad");
  }
  if (role !== "observer" && !S.view_only) {
    addBtn("b-mic", T.mic, async (b) => { if (!micTrack) return; micTrack.mediaStreamTrack.enabled = !micTrack.mediaStreamTrack.enabled; b.textContent = micTrack.mediaStreamTrack.enabled ? T.mic : T.micOff; b.setAttribute("aria-pressed", String(!micTrack.mediaStreamTrack.enabled)); });
    addBtn("b-cam", T.cam, async (b) => { if (!camTrack) return; const on = (camTrack.mediaStreamTrack.enabled = !camTrack.mediaStreamTrack.enabled); b.textContent = on ? T.cam : T.camOff; b.setAttribute("aria-pressed", String(!on)); const o = $id("t_me")?.querySelector(".off"); if (o) { o.hidden = on; o.textContent = T.camOff; } });
  }
  if (role === "participant") buildReactionButton();
  if (Q4.on) {   // the team's private chat: a small button that opens it over the page
    buildBackroom($id("brpop"));
    addBtn("b-chat", "后台聊天", () => { $id("brpop").hidden = !$id("brpop").hidden; });
  }
  addBtn("b-leave", T.leave, async () => {
    stopRecorder(); await R.q; localTracks.forEach((t) => { try { t.stop(); } catch {} }); if (room) room.disconnect(); ended = true;
    if (inviteT) fetch(`/api/public/join/${encodeURIComponent(inviteT)}/leave`, { method: "POST" }).catch(() => {});  // coming back needs nobody's permission
    msg(role === "participant" ? `${esc(T.left)} ${esc(T.leftBack)}` : "你已离开。"); bar.querySelectorAll("button").forEach((b) => (b.disabled = true));
  }, "bad");
  $id("b-mic")?.setAttribute("aria-pressed", "false"); $id("b-cam")?.setAttribute("aria-pressed", "false");
  if (role === "moderator") ["b-rec", "b-stop"].forEach((i) => ($id(i).disabled = true));

  if (!S.url) {  // no video server configured: show what this token would be allowed to do, so permissions can still be checked
    const claims = JSON.parse(atob(S.token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    (Q4.on ? $id("c2t") : grid).innerHTML = `<div style="grid-column:1/-1;overflow:auto;max-height:100%;padding:12px 14px;color:#CFE3DA;background:#15271F;border-radius:14px"><p><b>开发模式：</b>未配置 LIVEKIT_URL，没有视频。下面是这个令牌的实际权限（${role === "participant" ? "受访者" : { moderator: "主持人", observer: "观察员" }[role]}）。</p>
      <pre id="claims" style="background:#1b2a24;padding:12px;border-radius:10px;overflow:auto">${esc(JSON.stringify({ room: claims.video.room, ...claims.video }, null, 2))}</pre></div>`;
    poll(); setInterval(poll, 2000); setInterval(tick, 500);
    return;
  }
  await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "/vendor/livekit-client.umd.js"; s.onload = res; s.onerror = () => rej(new Error("video component failed to load")); document.head.appendChild(s); }).catch((e) => msg(esc(e.message)));
  if (!window.LivekitClient) return;

  room = new Room({ adaptiveStream: role !== "observer" && !S.view_only, dynacast: true });
  const personName = (p) => { const m = /^P-(\d+)$/.exec(p.name || ""); return m ? `${T.person} ·${m[1]}` : "受访者"; };  // group seats are "P-01"; a depth interview stays "受访者". Real names never reach the room.
  const nameOf = (p) => (p.identity.startsWith("participant:") ? personName(p) : role === "participant" ? T.mod : p.name || p.identity);
  LIVE.nameOf = nameOf;
  room.on(RoomEvent.ParticipantConnected, (p) => tile(p.identity, nameOf(p)));
  room.on(RoomEvent.TrackSubscribed, (track, pub, p) => { const el = tile(p.identity, nameOf(p)); if (track.kind === Track.Kind.Video) setTileVideo(el, track); else el.appendChild(track.attach()); });
  room.on(RoomEvent.TrackUnsubscribed, (track) => track.detach().forEach((x) => x.remove()));

addEventListener("pagehide", () => { stopRecorder(); capStop(); localTracks.forEach((t) => { try { t.stop(); } catch {} }); if (room) room.disconnect(); });
