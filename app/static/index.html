<script>
let ME = null, PROJECTS = null, DEMO_ORG = false;
const app = $("#app");
const route = () => location.hash.replace(/^#/, "") || "/projects";
const STAFF = () => ["admin", "researcher", "support"].includes(ME.role);
const VIEWER = () => ME.role === "viewer", RECRUITER = () => ME.role === "recruiter";   // a client who only reads, and someone who only recruits
const FMT_NAME = { audio: "纯音频", text: "文字访谈", text_voice: "文字+语音转录", video: "视频", video_screen: "视频+屏幕共享" };   // the five interview formats
/** The languages a project allows, as words ("中文、English"); the default one first. */
const langNames = (p) => ((p.languages && p.languages.length ? p.languages : [p.language]).map((l) => LANGS[l] || l)).join("、");
const when = (iso) => (iso ? new Date(iso + "Z").toLocaleString([], { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "—");

// ---------------- shell: dark-green nav + sticky project bar + white canvas ----------------
async function projects(force) { if (!PROJECTS || force) PROJECTS = await api("/projects"); return PROJECTS; }

function shell(inner, { active, p, title } = {}) {
  document.body.classList.remove("rfmode", "pgw");  // the new page is about to be painted: only now does the previous page's layout (fixed height, full width) go away; each view adds its own after this call
  document.body.classList.add("v11");
  const proj = p && STAFF();  // researchers and admins: stage modules + sub-menu
  const notice = p && p.closed_at ? `<div class="note"><b>项目已结项。</b>受访者的录像、转写原文、引文和分享链接将在 ${esc(new Date(p.purge_at + "Z").toLocaleDateString())} 自动删除（结项后 ${p.retention_days} 天），洞察结论会保留。</div>` : "";
  const menu = shSubMenu(p, active);
  shMount({ rail: shRail(active), thin: !!p, top: shTop(p, active, title), sub: shSubHtml(p, active, menu), notice, inner, cls: `enter${menu && menu.items.length ? " hubpage" : ""}` });
  labelTables();
  const hd = app.querySelector("main.hubpage > .head"), h1 = hd && hd.querySelector("h1"), tabOn = app.querySelector(".sub2 .l1.on .tx, .top2 .mod.on");
  if (h1 && tabOn) { const a = h1.textContent.trim(), b = tabOn.textContent.trim(); if (a === b || a === "项目" + b) hd.classList.add("dup"); }  // a title that only repeats the menu item's name is dropped; a page with its own title keeps it
  const hd2 = app.querySelector("main > .head"), h1b = hd2 && hd2.querySelector("h1"), pn = app.querySelector(".top2 .pname");
  if (h1b && pn && pn.textContent.trim() === h1b.textContent.trim()) hd2.classList.add("dup2");  // a page whose big title only repeats the title in the top bar: the big one is dropped (its buttons and any promise line stay)
  if (proj) shWire(p);
  const mb = $("#mebtn"), mc = $("#mecard");
  mb.onclick = (e) => { e.stopPropagation(); const open = mc.hidden; mc.hidden = !open; mb.setAttribute("aria-expanded", String(open)); };
  pageOn("mecard", document, "click", (e) => { if (!mc.hidden && !mc.contains(e.target)) { mc.hidden = true; mb.setAttribute("aria-expanded", "false"); } });
  $("#out").onclick = () => { store.del("tt_token"); ME = null; PROJECTS = null; DEMO_ORG = false; location.hash = "#/login"; render(); };
  if (p) {
    const cl = $("#closeproj"); if (cl) cl.onclick = guard(async () => { if (!confirm(`结项后 ${p.retention_days} 天，所有受访者的录像、转写和引文会被永久删除，只保留洞察结论。确定结项吗？`)) return; await api(`/projects/${p.id}/close`, { method: "POST" }); toast("已结项"); await projects(true); render(); });
    const ro = $("#reopen"); if (ro) ro.onclick = guard(async () => { await api(`/projects/${p.id}/reopen`, { method: "POST" }); toast("已重新打开"); await projects(true); render(); });
  }
}

// phones show list tables as cards: each cell carries its column name (CSS shows it as a label)
function labelTables(root = app) {
  root.querySelectorAll("table.tbl.rc").forEach((t) => {
    const heads = [...t.querySelectorAll("thead th")].map((th) => th.textContent.trim());
    t.querySelectorAll("tbody tr").forEach((tr) => [...tr.children].forEach((td, i) => { if (heads[i]) td.dataset.l = heads[i]; }));
  });
}

function modal(html) {
  const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div role="dialog" aria-modal="true">${html}</div>`;
  // 只有“在遮罩上按下、也在遮罩上松手”才关闭。用 click 判断会把一种情况也算成点遮罩：
  // 在输入框里按下鼠标、拖到框外松手（输入框有内容时想选中文字很容易这样），click 的事件目标是两端的公共祖先=.modal，弹窗就无辜消失了（用户 2026-11-03 报的 bug）。
  let downOnBackdrop = false;
  m.addEventListener("pointerdown", (e) => { downOnBackdrop = e.target === m; });
  m.addEventListener("pointerup", (e) => { if (downOnBackdrop && e.target === m) m.remove(); downOnBackdrop = false; });
  m.addEventListener("pointercancel", () => { downOnBackdrop = false; });
  document.body.appendChild(m); return m;
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll(".modal").forEach((m) => m.remove()); });

const HEAD_KEEP = ["数据保留", "研究库"];  // pages whose one line under the title is a promise about people's data; a lead that is a link or a status tag (not a sentence) stays; every other page shows the title only
const head = (title, lead, actions = "") => `<div class="head"><div><h1>${title}</h1>${lead && (HEAD_KEEP.includes(title) || /<a |class="tag/.test(lead)) ? `<p class="lead" style="margin:6px 0 0">${lead}</p>` : ""}</div><span class="sp"></span>${actions}</div>`;

// Every render gets a number. A slow page that finishes after the user has already moved on must neither paint over the new page nor
// show its (meaningless) error there: views call `stale(my)` after each await, where `my = renderSeq` was read at their start.
let renderSeq = 0;
let CUR_PROJ = null;  // the project last opened: the settings pages (team, data retention, audit log) keep its menu on the left
const stale = (my) => my !== renderSeq;

/* Listeners a page adds on window/document live only while that page is on screen: each page registers them by name (the same name replaces the
   old one, so re-drawing never stacks them) and they are all removed before the next page draws. Stacked listeners made the site slower the longer it was used. */
const PAGE_LS = new Map();
function pageOn(key, target, type, fn, opts) {
  const old = PAGE_LS.get(key); if (old) old();
  target.addEventListener(type, fn, opts);
  PAGE_LS.set(key, () => target.removeEventListener(type, fn, opts));
}
function pageOff() {
  PAGE_LS.forEach((off) => off()); PAGE_LS.clear();
  if (typeof RSP !== "undefined" && RSP.open && RSP.close) RSP.close(false);   // the respondent panel belongs to the page it was opened on
  document.body.classList.remove("rsp-open", "rsp-collapsed");
}
async function render() {
  pageOff();
  const seq = ++renderSeq;
  // the layout classes of the page on screen stay until the next page is painted (see shell / loginView): taking them off here made the old page reflow narrow, with a scrollbar and a blank right side, for as long as the next page was waiting for its data
  const r = route();
  if (r.startsWith("/login")) return loginView();
  if (document.body.classList.contains("anon")) {   // 从登录页进到应用：恢复这台电脑上选过的主题（登录页是固定浅色）
    document.body.classList.remove("anon");
    if (window.TT_THEME) TT_THEME.paint(TT_THEME.get());
  }
  if (!store.get("tt_token")) { location.hash = "#/login"; return; }
  if (!ME) {
    try { ME = await api("/me"); } catch { return loginView(); }
    if (ME.role === "admin") { try { const us = await api("/users"); DEMO_ORG = us.length > 0 && us.every((u) => /@demo\.test$/i.test(u.email)); } catch {} }
  }
  await loadConfig();
  if (stale(seq)) return;
  const seg = r.split("/");
  try {
    if (r === "/projects" || r === "/repo") CUR_PROJ = null;
    if (r === "/projects") return await projectsView();
    if (seg[1] === "p") {
      const p = (await projects()).find((x) => x.id === seg[2]);
      if (stale(seq)) return;
      if (p) CUR_PROJ = p.id;
      if (!p) throw new Error("找不到这个项目：可能链接已失效，或这个项目没有分配给你。回到“全部项目”重新选择。");
      const setup = p.plan_status && p.plan_status !== "published";  // a project still in the wizard has nothing else to open yet
      const page = setup && STAFF() ? "wiz" : seg[3] || (STAFF() ? "home" : VIEWER() ? "pool" : RECRUITER() ? "people" : "rooms");
      if (page === "wiz" && (STAFF() || RECRUITER())) return await wizardView(p);
      if (page === "monitor" && STAFF()) return await monitorView(p);
      if (page === "home" && STAFF()) return await homeView(p);
      if (page === "people" && (STAFF() || RECRUITER())) return await peopleView(p);
      if (page === "sessions") { location.replace(`#/p/${p.id}/rooms`); return; }  // the sessions-and-invitations page is gone
      if (page === "rooms" && !VIEWER() && !RECRUITER()) return await roomsView(p);
      if (page === "insights" && !VIEWER() && !RECRUITER()) return await insightsListView(p);
      if (page === "analysis") { location.replace(`#/p/${p.id}/insights`); return; }  // the coding page is gone
      if (page === "outline" && STAFF()) return await outlineView(p);
      if (page === "members" && STAFF()) return await membersView(p);
      if (page === "listening" && (STAFF() || VIEWER())) return await listeningView(p);
      if (page === "quant" && (STAFF() || VIEWER())) return await quantView(p);
      if (page === "pool" && (STAFF() || VIEWER())) return await poolView(p);
      if (page === "studies" && STAFF()) return seg[4] ? await studyView(p, seg[4]) : await studiesView(p);
      location.hash = `#/p/${p.id}/${VIEWER() ? "pool" : RECRUITER() ? "people" : "rooms"}`; return;
    }
    if (seg[1] === "i") {   // the old whole page is gone: the same address opens the respondent window over the project's insights page
      const it = await api(`/interviews/${seg[2]}`);
      if (stale(seq)) return;   // the user already moved on to another page: do not pull them back
      window._rspPending = { id: seg[2], tab: seg[3] || "transcript" };
      location.replace(`#/p/${it.project_id}/insights`); return;
    }
    if (r === "/repo" && STAFF()) return await repoView();
    if (r === "/retention") return await dataView();
    if (r === "/team") return await teamView();
    if (r === "/audit") return await auditView();
    if (r === "/ai") return await aiConsoleView();
    if (r === "/demo") return await demoView();
    location.hash = "#/projects";
  } catch (e) { if (stale(seq)) return; shell(`<div class="card empty"><b>${esc(e.message)}</b><span>如果刚才网络断开，刷新页面再试一次；问题一直存在，请把这句话发给管理员。</span><a class="btn p" href="#/projects">回到全部项目</a></div>`, { title: "打不开这个页面" }); }
}

// ---------------- login ----------------
function loginView() {
  document.body.classList.remove("rfmode", "pgw", "v11");
  document.body.classList.add("anon");   // 登录页不显示主题切换，固定浅色（用户 2026-11-03 要求）
  document.documentElement.setAttribute("data-theme", "light");
  let mode = "login";
  const draw = () => {
    if (mode === "forgot") return drawForgot();
    app.innerHTML = `<div class="login editorial-login"><section class="login-story"><div class="logo">${LOGO_SVG}</div><div><p class="login-kicker">TOTAL 研究平台</p><h1>把每一场访谈，变成可以追溯原话的结论</h1><p>从招募、访谈到报告，引文始终指向转写里的原话。</p></div><small>运营主体在中国 · 星桐是处理者</small></section><div class="box">
      <form class="card" id="f"><h2>${mode === "login" ? "登录" : "创建组织"}</h2><p class="mut sm">真人深访：招募、视频访谈、转写，以及带原文回链的洞察。</p>
      ${mode === "reg" ? `<label class="f"><span>组织名称</span><input name="org_name" required></label><label class="f"><span>你的姓名</span><input name="name" required></label>` : ""}
      <label class="f"><span>邮箱</span><input name="email" type="email" required autocomplete="username"></label>
      <label class="f"><span>密码（至少 8 位）</span><input name="password" type="password" minlength="8" required autocomplete="${mode === "login" ? "current-password" : "new-password"}"></label>
      <div class="row"><button class="p">${mode === "login" ? "登录" : "创建并进入"}</button><span class="sp"></span>${mode === "login" ? `<button type="button" class="lnk" id="fg">忘记密码</button> ` : ""}<button type="button" class="lnk" id="sw">${mode === "login" ? "创建新组织" : "已有账号，去登录"}</button></div></form></div></div>`;
    if (!window._brandShown) { window._brandShown = true; brandPlay(); }
    $("#sw").onclick = () => { mode = mode === "login" ? "reg" : "login"; draw(); };
    if ($("#fg")) $("#fg").onclick = () => { mode = "forgot"; draw(); };
    $("#f").onsubmit = guard(async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      const r = await api(mode === "login" ? "/auth/login" : "/auth/register", { method: "POST", body, auth: false });
      store.set("tt_token", r.token); ME = null; PROJECTS = null; window._brandShown = false; location.hash = "#/projects"; render();
    });
  };
  const drawForgot = () => {  // the answer is always the same, so nobody can find out who has an account
    app.innerHTML = `<div class="login editorial-login"><section class="login-story"><div class="logo">${LOGO_SVG}</div><div><p class="login-kicker">TOTAL 研究平台</p><h1>把每一场访谈，变成可以追溯原话的结论</h1><p>从招募、访谈到报告，引文始终指向转写里的原话。</p></div><small>运营主体在中国 · 星桐是处理者</small></section><div class="box">
      <form class="card" id="f"><h2>忘记密码</h2><p class="mut sm">填写你的登录邮箱。如果它对应一个账号，我们会发一封带重设链接的邮件（1 小时内有效）。</p>
      <label class="f"><span>邮箱</span><input name="email" type="email" required autocomplete="username"></label>
      <p class="sm" id="done" role="status" hidden>如果这个邮箱对应一个账号，邮件已经在路上了。几分钟内没收到，请看垃圾邮件箱，或联系你们公司的管理员。</p>
      <div class="row"><button class="p" id="fgo">发送重设邮件</button><span class="sp"></span><button type="button" class="lnk" id="bk">返回登录</button></div></form></div></div>`;
    $("#bk").onclick = () => { mode = "login"; draw(); };
    $("#f").onsubmit = guard(async (e) => {
      e.preventDefault();
      await api("/auth/forgot", { method: "POST", body: Object.fromEntries(new FormData(e.target)), auth: false });
      $("#done").hidden = false; $("#fgo").disabled = true;
    });
  };
  draw();
}

// ---------------- 全部项目：卡片 + 搜索 + 状态筛选 ----------------
function projectCard(p) {
  const s = p.summary;
  const st = p.closed_at ? `<span class="tag">已结项</span>` : s && s.live ? `<span class="tag live">${s.live} 场进行中</span>` : `<span class="tag ok">进行中</span>`;
  const setup = p.plan_status && p.plan_status !== "published";
  const stt = setup ? `<span class="tag o">${{ draft: "草稿", review: "审查中", approved: "待发布" }[p.plan_status] || "立项中"}</span>` : st;
  return `<a class="card pcard" href="#/p/${p.id}${setup ? "/wiz" : ""}" data-project-id="${p.id}" data-name="${esc(p.name.toLowerCase())}" data-st="${p.closed_at ? "closed" : "open"}" aria-selected="false">
    ${ME.role === "admin" ? `<span class="project-select" aria-hidden="true"><span></span></span>` : ""}
    <div class="pc-top">${stt}</div><h3 title="${esc(p.name)}">${esc(p.name)}</h3>
    <div class="sm mut" title="${esc([p.market || "—", langNames(p), p.brief || ""].filter(Boolean).join(" · "))}">${esc(p.market || "—")} · ${esc(langNames(p))}${p.brief ? " · " + esc(p.brief).slice(0, 40) : ""}</div>
    ${s ? `<div class="nums"><div><b>${s.participants}</b><span>受访者</span></div><div><b>${s.done}/${s.sessions}</b><span>场次完成</span></div><div><b>${s.approved}</b><span>洞察已通过</span></div></div>
      <div class="sm">${s.next_at ? `下一场：<b>${when(s.next_at)}</b>` : `<span class="mut">没有待开始的场次</span>`}</div>` : ""}</a>`;
}
async function projectsView() {
  const ps = await projects(true);
  const canMake = STAFF();
  const q = sessionStorage.getItem("pq") || "", f = sessionStorage.getItem("pf") || "open";
  const actions = canMake ? `<div class="project-actions"><button class="p" id="np">新建项目</button>${ME.role === "admin" ? `<button id="pdc" hidden>取消选择</button><button class="warn" id="pdel" aria-pressed="false">删除项目</button>` : ""}</div>` : "";
  shell(`${head("全部项目", canMake ? "每个项目按“受访者招募 → 场次与邀请 → 直播间 → 洞察与片段”推进。点卡片进入项目。" : "分配给你的项目。点卡片进入直播间或查看洞察。", actions)}
    ${ps.length ? `<div class="filters"><input type="search" id="pq" placeholder="搜索项目名称" aria-label="搜索项目名称" value="${esc(q)}">
      <div class="stats" role="group" aria-label="按状态筛选" style="margin:0">${[["open", "进行中"], ["closed", "已结项"], ["all", "全部"]].map(([k, n]) => `<button data-pf="${k}" aria-pressed="${f === k}">${n} <b>${k === "all" ? ps.length : ps.filter((p) => (k === "closed") === !!p.closed_at).length}</b></button>`).join("")}</div></div>
      <div class="grid" id="pgrid">${ps.map(projectCard).join("")}</div><div class="card empty" id="pnone" hidden>没有符合条件的项目。换个关键词，或点“全部”。</div>`
      : `<div class="card empty">${canMake ? `<b>还没有项目。</b><span>新建一个项目，然后在里面添加受访者、新建场次。</span>` : `<b>还没有分配给你的项目。</b><span>研究员把你加到某场访谈后，项目会出现在这里。</span>`}</div>`}`, { active: "projects", title: "全部项目" });
  app.querySelector("main").classList.add("projects-page");
  const pf = app.querySelector("main .filters"), pa = app.querySelector("main .project-actions"), ph = app.querySelector("main > .head");
  if (pf && pa && ph) { pf.appendChild(pa); ph.remove(); }  // the top bar already says "全部项目": no second title; the buttons sit at the right end of the search row
  const apply = () => {
    const qq = ($("#pq") || {}).value?.trim().toLowerCase() || "", ff = sessionStorage.getItem("pf") || "open";
    let n = 0;
    app.querySelectorAll(".pcard").forEach((c) => { const show = c.dataset.name.includes(qq) && (ff === "all" || c.dataset.st === ff); c.hidden = !show; n += show; });
    if ($("#pnone")) $("#pnone").hidden = n > 0;
  };
  if ($("#pq")) { $("#pq").oninput = () => { sessionStorage.setItem("pq", $("#pq").value); apply(); }; apply(); }
  app.querySelectorAll("[data-pf]").forEach((b) => b.onclick = () => { sessionStorage.setItem("pf", b.dataset.pf); app.querySelectorAll("[data-pf]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); apply(); });
  const del = $("#pdel"), cancel = $("#pdc"), selected = new Set();
  const drawDelete = () => {
    const choosing = app.querySelector("main").classList.contains("delete-selecting");
    app.querySelectorAll(".pcard").forEach((c) => { const on = selected.has(c.dataset.projectId); c.classList.toggle("is-selected", on); c.setAttribute("aria-selected", String(on)); });
    if (del) { del.textContent = choosing && selected.size ? `删除所选（${selected.size}）` : "删除项目"; del.setAttribute("aria-pressed", String(choosing)); }
    if (cancel) cancel.hidden = !choosing;
  };
  if (del) del.onclick = guard(async () => {
    const main = app.querySelector("main");
    if (!main.classList.contains("delete-selecting")) { main.classList.add("delete-selecting"); drawDelete(); return; }
    if (!selected.size) { toast("请先选择要删除的项目"); return; }
    const chosen = ps.filter((p) => selected.has(p.id));

// The platform does not send e-mail or messages: it prepares the link, a ready-to-send text and a calendar file, and the team sends them.
const pad2 = (n) => String(n).padStart(2, "0");
const icsStamp = (d) => `${d.getUTCFullYear()}${pad2(d.getUTCMonth() + 1)}${pad2(d.getUTCDate())}T${pad2(d.getUTCHours())}${pad2(d.getUTCMinutes())}00Z`;
const utcDate = (sched) => new Date(sched + "Z");
function inviteText(url, sched, reminder) {
  const at = sched ? utcDate(sched).toLocaleString("zh-CN", { dateStyle: "medium", timeStyle: "short", timeZone: "Asia/Singapore" }) + "（新加坡时间）" : "";
  if (reminder) return `提醒：您预约的访谈将在${at ? " " + at : "约定时间"} 开始。请提前 10 分钟点击下面的链接，完成设备检测并进入候场室：
${url}
建议使用耳机并在安静的地方。`;
  return `您好，邀请您参加一次约 30–45 分钟的访谈研究。
时间：${at || "我们会另行与您确认"}
请点击链接，按提示完成设备检测与隐私同意：
${url}
摄像头可以关闭，只用语音也可以参加。`;
}
function downloadIcs(title, sched, url) {
  const start = utcDate(sched), end = new Date(start.getTime() + 45 * 60000), esc2 = (x) => String(x).replace(/[\\;,]/g, (c) => "\\" + c).replace(/\n/g, "\\n");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//TOTAL//Interview//EN", "BEGIN:VEVENT", `UID:${crypto.randomUUID()}@total`, `DTSTAMP:${icsStamp(new Date())}`, `DTSTART:${icsStamp(start)}`, `DTEND:${icsStamp(end)}`,
    `SUMMARY:${esc2(title)}`, `DESCRIPTION:${esc2("访谈入口：" + url)}`, "BEGIN:VALARM", "TRIGGER:-PT15M", "ACTION:DISPLAY", "DESCRIPTION:访谈即将开始", "END:VALARM", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" })); a.download = "interview.ics"; document.body.appendChild(a); a.click(); a.remove();
}

function roomState(i) {
  if (i.purged) return ["已按保留期清除", ""];
  if (i.status === "ended") return ["已结束", "ok"];
  if (i.status === "live") return ["进行中", "live"];
  if (i.waiting) return ["已在房间", "ok"];
  if (i.entered) return ["进过房间", "ok"];
  if (i.invite_state === "consented") return ["已就绪", "o"];
  return ["未就绪", ""];
}
const startOf = (i) => i.started_at || i.scheduled_at || "";
function timeBucket(i) {   // which group a session's start time falls in, for the filter
  const s = startOf(i); if (!s) return "随时可进入";
  const t = new Date(s + "Z").getTime(), now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(), day = 86400000;
  if (t >= d0 && t < d0 + day) return "今天";
  const diff = (t - now.getTime()) / day;
  return diff < -7 ? "更早" : diff > 7 ? "更晚" : "近 7 天";
}
const TIME_ORDER = ["今天", "近 7 天", "更晚", "更早", "随时可进入"];

async function reelEditor(p, reel, my) {
  const clips = await api(`/projects/${p.id}/clips`);
  let order = reel ? reel.items.map((x) => x.id) : [];
  const byId = Object.fromEntries(clips.map((c) => [c.id, c]));
  const m = modal(`<h2>${reel ? "编辑集锦" : "新建集锦"}</h2>
    <label>名称<input id="rt" maxlength="200" value="${esc(reel ? reel.title : "")}"></label>
    <label>说明（给看的人，可不填）<textarea id="rn" maxlength="1000" rows="2">${esc(reel ? reel.note : "")}</textarea></label>
    <h3 style="margin:10px 0 4px">已选片段（按播放顺序）</h3><div id="rsel"></div>
    <h3 style="margin:10px 0 4px">可选片段</h3><div id="rpool"></div>
    <div class="row" style="margin-top:10px"><button class="p" id="rsave">保存</button><button type="button" id="rc">关闭</button><span class="sp"></span>${reel ? `<button class="s" id="rshare">生成分享链接</button> <button class="s warn" id="rdel">删除集锦</button>` : ""}</div>
    <div id="rshares">${reel ? sharesHtml(reel) : ""}</div>`);
  const draw = () => {
    $("#rsel", m).innerHTML = order.length ? order.map((id, n) => `<div class="hit row"><span><b>${n + 1}.</b> ${esc(byId[id].title)} <span class="mut sm">${esc(byId[id].who)}</span></span><span class="sp"></span>
        <button class="s" data-up="${n}" aria-label="上移">上移</button><button class="s" data-dn="${n}" aria-label="下移">下移</button><button class="s warn" data-rm="${n}" aria-label="移除">移除</button></div>`).join("") : `<p class="mut sm">还没有选。</p>`;
    const rest = clips.filter((c) => !order.includes(c.id));
    $("#rpool", m).innerHTML = rest.length ? rest.map((c) => `<div class="hit row"><span>${esc(c.title)} <span class="mut sm">${esc(c.who)}</span></span><span class="sp"></span><button class="s" data-add="${c.id}">加入</button></div>`).join("") : `<p class="mut sm">没有更多片段了。</p>`;
    m.querySelectorAll("[data-up]").forEach((b) => b.onclick = () => { const n = +b.dataset.up; if (n > 0) { [order[n - 1], order[n]] = [order[n], order[n - 1]]; draw(); } });
    m.querySelectorAll("[data-dn]").forEach((b) => b.onclick = () => { const n = +b.dataset.dn; if (n < order.length - 1) { [order[n + 1], order[n]] = [order[n], order[n + 1]]; draw(); } });
    m.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { order.splice(+b.dataset.rm, 1); draw(); });
    m.querySelectorAll("[data-add]").forEach((b) => b.onclick = () => { order.push(b.dataset.add); draw(); });
  };
  draw();
  $("#rc", m).onclick = () => m.remove();
  $("#rsave", m).onclick = guard(async () => {
    const body = { title: $("#rt", m).value.trim(), note: $("#rn", m).value.trim(), clip_ids: order };
    if (reel) await api(`/reels/${reel.id}`, { method: "PUT", body }); else await api(`/projects/${p.id}/reels`, { method: "POST", body });
    m.remove(); toast("已保存"); reelsSection(p, my);
  });
  if (reel) {
    $("#rdel", m).onclick = guard(async () => { if (!confirm("删除这个集锦？已发出的链接会立刻失效，片段本身不受影响。")) return; await api(`/reels/${reel.id}`, { method: "DELETE" }); m.remove(); toast("已删除"); reelsSection(p, my); });
    $("#rshare", m).onclick = guard(async () => {
      const s = await api(`/reels/${reel.id}/share`, { method: "POST", body: { expires_hours: 72 } });
      $("#rshares", m).insertAdjacentHTML("afterbegin", `<div class="card" style="margin-top:8px"><b>新链接（只显示这一次）</b><input readonly value="${esc(location.origin + s.path)}" aria-label="分享链接" onclick="this.select()"><p class="sm mut" style="margin:4px 0 0">72 小时后失效，水印：${esc(s.watermark)}</p></div>`);
    });
    m.querySelectorAll("[data-rv]").forEach((b) => b.onclick = guard(async () => { await api(`/reel-shares/${b.dataset.rv}`, { method: "DELETE" }); b.replaceWith(Object.assign(document.createElement("span"), { className: "tag", textContent: "已撤销" })); }));
  }
}

      : `<div class="card empty"><b>还没有异步研究。</b></div>`}

      <label class="f"><span>研究名称</span><input name="title" required maxlength="200"></label>
      <label class="f"><span>研究目标（不会念给受访者）</span><textarea name="goal" rows="3" required maxlength="1000" placeholder="例如：了解新加坡 25–35 岁女性如何挑选护肤品，以及哪些信息最影响她们的决定"></textarea></label>
      <div class="row"><label class="f" style="flex:1"><span>访谈语言</span><select name="language">${["zh", "en"].map((k) => `<option value="${k}"${k === (p.language === "en" ? "en" : "zh") ? " selected" : ""}>${LANGS[k]}</option>`).join("")}</select></label>
        <label class="f" style="flex:1"><span>大约时长</span><select name="duration_min">${[10, 15, 20, 30, 45, 60].map((n) => `<option value="${n}"${n === 20 ? " selected" : ""}>${n} 分钟</option>`).join("")}</select></label></div>
      <label class="f"><span>告诉受访者的话题（选填，18 字以内，别写品牌名）</span><input name="participant_topic" maxlength="18"></label>
      <button class="p">创建并起草提纲</button></form></div>`, { active: "studies", p });
  $("#nf").onsubmit = guard(async (e) => {
    e.preventDefault();
    const b = Object.fromEntries(new FormData(e.target)); b.duration_min = Number(b.duration_min);
    const s = await api(`/projects/${p.id}/studies`, { method: "POST", body: b });
    location.hash = `#/p/${p.id}/studies/${s.id}`;
  });
}

async function studyView(p, sid) {
  const my = renderSeq;
  const [s, parts] = await Promise.all([api(`/studies/${sid}`), api(`/projects/${p.id}/participants`)]);
  if (stale(my)) return;
  const invitedIds = new Set(s.sessions.map((x) => x.participant.id));
  const canInvite = parts.filter((x) => x.screening === "eligible" && !x.anonymized && !invitedIds.has(x.id));
  const closed = s.status === "closed";
  const [stName, stCls] = STUDY_STATUS[s.status];
  const sess = (x) => { const [n, c] = STUDY_STATE[x.state]; return `<tr><td><b>${esc(x.participant.name)}</b></td><td>${esc(x.participant.country || "—")}</td><td><span class="tag ${c}">${n}</span>${x.alert !== "none" ? ` <span class="tag bad" title="${esc(x.alert_reason)}">需要查看</span>` : ""}</td>
      <td class="acts"><a class="btn s" href="#/i/${x.interview_id}">${x.state === "in_progress" ? "查看对话" : "打开记录"}</a></td></tr>`; };
  shell(`${head(esc(s.title), `<a href="#/p/${p.id}/studies">← 全部异步研究</a> · <span class="tag ${stCls}">${stName}${s.version ? ` · 第 ${s.version} 版` : ""}</span> · ${esc(LANGS[s.language])} · ${s.duration_min} 分钟`,
      closed ? "" : `<button class="s warn" id="close">关闭研究</button>`)}
    <div class="card"><h3>研究目标</h3><p style="margin:0;white-space:pre-wrap">${esc(s.goal)}</p></div>
    <div class="card"><h3>提纲${s.drafted_by ? ` <span class="tag">已起草</span>` : ""}</h3>
      
      <label class="f"><span>提纲文字（可直接修改）</span><textarea id="outline" rows="18" ${closed ? "disabled" : ""} style="font-family:ui-monospace,Consolas,'Noto Sans SC','PingFang SC','Microsoft YaHei',monospace;font-size:14px">${esc(s.outline_text)}</textarea></label>
      <p class="sm" id="problem" role="alert" hidden style="color:#A8203E"></p>
      
      ${closed ? "" : `<div class="row"><button id="draft">${s.outline_text ? "重新起草" : "起草"}</button><button id="save">保存</button><span class="sp"></span><button class="p" id="publish">${s.version ? `发布第 ${s.version + 1} 版` : "发布"}</button></div>`}</div>
    ${s.status === "published" ? `<div class="card"><h3>邀请受访者</h3>${canInvite.length
      ? `<form id="inv">
        ${canInvite.map((x) => `<label class="chk"><input type="checkbox" name="pid" value="${x.id}"><span>${esc(x.name)}${x.country ? ` · ${esc(x.country)}` : ""}</span></label>`).join("")}<button class="p" style="margin-top:8px">生成邀请链接</button></form>`
      : `<p class="mut" style="margin:0">项目里没有可以邀请的新受访者。先到“受访者招募”添加。</p>`}</div>` : ""}
    ${s.status === "published" ? `<div class="card"><h3>公开报名链接</h3>
      
      ${s.open.enabled ? `<p style="margin:0 0 10px">已开启 · 已有 ${s.open.sessions} / ${s.open.cap} 人${s.open.full ? "（名额已满）" : ""}</p><div class="row"><button id="oln">重新生成链接</button><button class="s warn" id="olf">关闭公开链接</button></div>`
        : `<form id="olform" class="row"><label class="f" style="flex:1;margin:0"><span>人数上限（含你邀请的）</span><input name="cap" type="number" min="1" max="1000" value="100"></label><button class="p">开启公开链接</button></form>`}</div>` : ""}
    ${s.progress.invited ? `<p class="sm mut" id="prog">已开始 ${s.progress.started} · 已完成 ${s.progress.finished}${s.progress.completion_rate !== null ? `（完成率 ${Math.round(s.progress.completion_rate * 100)}%）` : ""} · 提前结束 ${s.progress.ended_early}${s.progress.median_minutes !== null ? ` · 完成者中位用时 ${s.progress.median_minutes} 分钟` : ""}</p>` : ""}
    ${s.sessions.length ? `<h2>受访者</h2><div class="card scroll" style="padding:6px 10px"><table class="tbl rc"><thead><tr><th>姓名</th><th>国家</th><th>进度</th><th></th></tr></thead><tbody>${s.sessions.map(sess).join("")}</tbody></table></div>` : ""}`,
    { active: "studies", p });
  const show = (r) => { const pr = $("#problem"); if (r && r.problem) { pr.textContent = r.problem; pr.hidden = false; } else { pr.hidden = true; } };
  const text = () => $("#outline").value;
  if (!closed) {
    $("#save").onclick = guard(async () => { const r = await api(`/studies/${sid}/outline`, { method: "PUT", body: { text: text() } }); show(r); toast(r.problem ? "已保存，但提纲还有问题" : "已保存"); });
    $("#draft").onclick = guard(async () => {
      if (text().trim() && !confirm("起草会替换编辑框里的内容。继续？")) return;
      const b = $("#draft"); b.disabled = true; b.textContent = "正在起草，请稍等…";
      try { await api(`/studies/${sid}/draft`, { method: "POST" }); toast("已起草，请检查并修改"); render(); } finally { b.disabled = false; }
    });
    $("#publish").onclick = guard(async () => {
      const saved = await api(`/studies/${sid}/outline`, { method: "PUT", body: { text: text() } });
      show(saved); if (saved.problem) { toast("提纲还有问题，先改好再发布", true); return; }
      if (!confirm("发布后，之后开始的访谈都按这一版提问。确定发布？")) return;
      await api(`/studies/${sid}/publish`, { method: "POST" }); toast("已发布"); render();
    });
    $("#close").onclick = guard(async () => {
      if (!confirm("关闭后链接失效，还没完成的访谈会就此结束（已说的内容保留）。确定关闭？")) return;
      await api(`/studies/${sid}/close`, { method: "POST" }); toast("已关闭"); render();
    });
  }
  const showOpen = (r) => { if (!r.open_path) { toast("已更新"); render(); return; }
    const m = modal(`<h2>公开报名链接（只显示这一次）</h2><code class="copy">${esc(location.origin + r.open_path)}</code><p class="sm mut">重新生成会让旧链接失效。</p><div class="row" style="margin-top:12px"><button class="p" id="done2">我已复制</button></div>`);
    $("#done2", m).onclick = () => { m.remove(); render(); }; };
  const post = (enabled, cap) => api(`/studies/${sid}/open-link`, { method: "POST", body: { enabled, cap } }).then(showOpen);
  const of = $("#olform"); if (of) of.onsubmit = guard(async (e) => { e.preventDefault(); await post(true, Number(new FormData(of).get("cap"))); });
  const on = $("#oln"); if (on) on.onclick = guard(async () => { if (confirm("旧的公开链接会立刻失效。继续？")) await post(true, s.open.cap); });
  const off = $("#olf"); if (off) off.onclick = guard(async () => { if (confirm("关闭后链接立刻失效，已经报名的人不受影响。继续？")) await post(false, s.open.cap); });
  const f = $("#inv");
  if (f) f.onsubmit = guard(async (e) => {
    e.preventDefault();
    const ids = [...f.querySelectorAll("input[name=pid]:checked")].map((i) => i.value);
    if (!ids.length) { toast("请先勾选受访者", true); return; }
    const r = await api(`/studies/${sid}/invites`, { method: "POST", body: { participant_ids: ids } });
    const m = modal(`<h2>邀请链接（只显示这一次）</h2>${r.invites.map((i) => `<p style="margin:10px 0 2px"><b>${esc(i.name)}</b></p><code class="copy">${esc(location.origin + i.invite_path)}</code>`).join("")}
      ${r.skipped.length ? `<p class="sm mut">没有生成：${r.skipped.map((x) => `${esc(x.name)}（${esc(x.why)}）`).join("、")}</p>` : ""}<div class="row" style="margin-top:12px"><button class="p" id="done">我已复制</button></div>`);
    $("#done", m).onclick = () => { m.remove(); render(); };
  });
}

// ---------------- 研究库：搜索和提问整个公司做过的研究 ----------------
const HIT_TYPE = { segment: "访谈原话", insight: "已确认洞察", document: "导入资料" };
const mmss = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}`;
const hitHtml = (h) => `<div class="hit"><div class="sm mut"><span class="tag">${HIT_TYPE[h.type]}</span>${h.who ? ` <b>${esc(h.who)}</b> · ` : " "}${h.project ? esc(h.project.name) : "全公司资料"}${h.title ? ` · ${esc(h.title)}` : ""}${h.type === "segment" ? ` · ${mmss(h.at_ms)}` : ""}</div>
  ${h.question_before ? `<div class="sm mut" style="margin-top:4px">访谈员问：${esc(h.question_before)}</div>` : ""}
  <p style="margin:4px 0 0;white-space:pre-wrap">${esc(h.text)}</p>${h.interview_id ? `<a class="sm" href="#/i/${h.interview_id}">打开这场访谈 →</a>` : ""}</div>`;

async function repoView() {
  const my = renderSeq;
  const [docs, projs] = await Promise.all([api("/repo/documents"), projects()]);
  if (stale(my)) return;
  const scope = `<option value="">全部我能看到的项目</option>${projs.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}`;
  shell(`${head("研究库", "只显示你所在项目的内容；受访者只显示编号。", `<button class="p" id="imp">导入资料</button>`)}
    <div class="card"><form id="qf"><label class="f"><span>输入关键词来搜索，或者直接问一个问题</span><input name="q" required maxlength="500" placeholder="例如：消费者为什么觉得价格太贵？"></label>
      <div class="row"><label class="f" style="flex:1;margin:0"><span>范围</span><select name="project_id">${scope}</select></label>
      <button class="p" id="ask" type="button">提问</button><button id="srch" type="submit">搜索原文</button></div></form></div>
    <div id="res" aria-live="polite"></div>
    <h2>导入的资料</h2>${docs.length ? `<div class="card scroll" style="padding:6px 10px"><table class="tbl rc"><thead><tr><th>标题</th><th>来源说明</th><th>范围</th><th>字数</th><th></th></tr></thead><tbody>
      ${docs.map((d) => `<tr><td><b>${esc(d.title)}</b></td><td class="mut">${esc(d.source_note || "—")}</td><td>${d.project ? esc(d.project.name) : "全公司"}</td><td>${d.chars}</td><td class="acts"><button class="s warn" data-del="${d.id}">删除</button></td></tr>`).join("")}</tbody></table></div>`
      : `<div class="card empty"><b>还没有导入的资料。</b><span>把以前的报告、笔记、桌面研究导入进来，就能和访谈原话一起被搜索和提问。</span></div>`}`, { active: "repo", title: "研究库" });
  const res = $("#res"), qf = $("#qf");
  const busy = (on, text) => { res.innerHTML = on ? `<p class="mut" role="status">${text}</p>` : ""; $("#ask").disabled = on; $("#srch").disabled = on; };
  const val = () => Object.fromEntries(new FormData(qf));
  qf.onsubmit = guard(async (e) => {
    e.preventDefault(); const v = val(); busy(true, "搜索中…");
    try {
      const r = await api(`/repo/search?q=${encodeURIComponent(v.q)}${v.project_id ? `&project_id=${v.project_id}` : ""}&limit=20`);
      res.innerHTML = r.hits.length ? `<h2>找到 ${r.hits.length} 条相关内容</h2>${r.hits.map(hitHtml).join("")}` : `<div class="card empty"><b>没有找到相关内容。</b><span>换几个关键词，或把范围改成全部项目。</span></div>`;
    } finally { $("#ask").disabled = false; $("#srch").disabled = false; }
  });
  $("#ask").onclick = guard(async () => {
    if (!qf.reportValidity()) return;
    const v = val(); busy(true, "正在阅读资料并回答，大约需要几秒…");
    try {
      const r = await api("/repo/ask", { method: "POST", body: { question: v.q, project_id: v.project_id || null } });
      res.innerHTML = r.insufficient ? `<div class="note" role="status"><b>证据不足。</b> ${esc(r.message)}</div>`
        : `<h2>回答</h2>${r.answer.map((c, i) => `<div class="card"><p style="margin:0 0 8px"><b>${i + 1}.</b> ${esc(c.text)}</p><details open><summary class="sm mut">依据（${c.evidence.length} 条原文）</summary>${c.evidence.map(hitHtml).join("")}</details></div>`).join("")}
          `;
    } finally { $("#ask").disabled = false; $("#srch").disabled = false; }
  });
  $("#imp").onclick = () => {
    const m = modal(`<h2>导入资料</h2><form id="f"><label class="f"><span>标题</span><input name="title" required maxlength="200"></label>
      <label class="f"><span>来源说明（选填，谁写的、什么时候）</span><input name="source_note" maxlength="300"></label>
      <label class="f"><span>谁能搜到</span><select name="project_id"><option value="">全公司的研究员和管理员</option>${projs.map((p) => `<option value="${p.id}">只有项目成员：${esc(p.name)}</option>`).join("")}</select></label>
      <label class="f"><span>选一个文件（Word .docx、.txt、.md、.csv），或在下面直接粘贴文字</span><input type="file" id="file" accept=".docx,.txt,.md,.markdown,.csv,.tsv"></label>
      <label class="f"><span>内容（选了文件就不用填）</span><textarea name="text" rows="8" maxlength="200000"></textarea></label>
      <div class="row"><button class="p">导入</button><button type="button" id="c">取消</button></div></form>`);
    $("#c", m).onclick = () => m.remove();
    $("#file", m).onchange = (e) => { const f = e.target.files[0]; if (f && !$("[name=title]", m).value) $("[name=title]", m).value = f.name.replace(/\.[^.]+$/, ""); };
    $("#f", m).onsubmit = guard(async (e) => {
      e.preventDefault(); const fd = new FormData(e.target), file = $("#file", m).files[0];
      if (file) {   // a file goes up as it is; the server reads the text (Word included)
        const up = new FormData(); up.append("file", file); up.append("title", fd.get("title") || ""); up.append("project_id", fd.get("project_id") || ""); up.append("source_note", fd.get("source_note") || "");
        const r = await fetch("/api/repo/documents/upload", { method: "POST", headers: { Authorization: "Bearer " + store.get("tt_token") }, body: up });
        if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.detail || "导入失败"); }
      } else {
        const b = Object.fromEntries(fd); b.project_id = b.project_id || null;
        if (!(b.text || "").trim()) throw new Error("请选一个文件，或粘贴文字内容");
        await api("/repo/documents", { method: "POST", body: b });
      }
      m.remove(); toast("已导入"); render();
    });
  };
  app.querySelectorAll("[data-del]").forEach((b) => b.onclick = guard(async () => { if (!confirm("删除后这份资料不会再被搜索到。继续？")) return; await api(`/repo/documents/${b.dataset.del}`, { method: "DELETE" }); toast("已删除"); render(); }));
}

// ---------------- 舆情监测：公开渠道上的声音 ----------------
const L_KIND = { mock: "模拟数据（试用）", rss: "新闻 / 博客订阅（RSS）", appstore: "App Store 评论", web: "公开网页（选择器）" };
const L_SENT = { neg: ["负面", "bad"], neu: ["中性", ""], pos: ["正面", "ok"] };
async function listeningView(p) {
  const my = renderSeq;
  const o = await api(`/projects/${p.id}/listening`);
  if (stale(my)) return;
  const RO = VIEWER();
  const S = o.summary, sn = S.sentiment, maxDay = Math.max(1, ...S.per_day.map((d) => d.neg + d.neu + d.pos + d.none));
  const when = (t) => (t ? new Date(t + "Z").toLocaleString() : "还没运行");
  const bars = S.per_day.length ? `<div class="sbars" role="img" aria-label="每天的声量和情感：${S.per_day.map((d) => `${d.day} 共 ${d.neg + d.neu + d.pos + d.none} 条`).join("，")}">${S.per_day.map((d) => { const t = d.neg + d.neu + d.pos + d.none; return `<div class="sday" title="${d.day}：负面 ${d.neg}，中性 ${d.neu}，正面 ${d.pos}"><div class="sstack" style="height:${Math.round((t / maxDay) * 100)}%"><i class="sneg" style="flex:${d.neg}"></i><i class="sneu" style="flex:${d.neu + d.none}"></i><i class="spos" style="flex:${d.pos}"></i></div><span>${d.day.slice(5)}</span></div>`; }).join("")}</div>
    <p class="sm mut" style="margin:6px 0 0"><i class="dot sneg"></i> 负面 <i class="dot sneu"></i> 中性 <i class="dot spos"></i> 正面</p>` : `<p class="mut" style="margin:0">最近 ${S.days} 天还没有内容。添加来源并点“立即运行”。</p>`;
  const row = (s) => `<tr><td><b>${esc(s.name)}</b><div class="sm mut">${esc(L_KIND[s.kind] || s.kind)}</div></td>
      <td>${s.last_status === "ok" ? `<span class="tag ok">正常</span>` : s.last_status === "error" ? `<span class="tag bad" title="${esc(s.last_error)}">出错</span>` : `<span class="tag">未运行</span>`}${s.enabled ? "" : ` <span class="tag">已暂停</span>`}
        ${s.last_status === "error" ? `<div class="sm" style="color:#A8203E">${esc(s.last_error)}</div>` : ""}</td>
      <td class="mut">${esc(when(s.last_run_at))}<div class="sm">上次新增 ${s.last_count} 条 · 每 ${s.interval_min} 分钟</div></td><td>${s.mentions}</td>
      <td class="acts">${RO ? "" : `<button class="s" data-run="${s.id}">立即运行</button> <button class="s" data-tog="${s.id}" data-to="${s.enabled ? 0 : 1}">${s.enabled ? "暂停" : "启用"}</button> <button class="s warn" data-del="${s.id}">删除</button>`}</td></tr>`;
  shell(`${head("舆情监测", "公开渠道上的评论、帖子、新闻：自动采集，打上语言、情感和话题，和访谈放在一起看。只存正文、链接和作者的哈希（不存名字和头像）。", RO ? "" : `<button class="p" id="addsrc">添加来源</button>`)}
    <div class="grid"><div class="card"><div class="sm mut">最近 ${S.days} 天的内容</div><div class="big">${S.total}</div></div>
      <div class="card"><div class="sm mut">负面占比</div><div class="big">${S.negative_share === null ? "—" : Math.round(S.negative_share * 100) + "%"}</div><div class="sm mut">负面 ${sn.neg} · 中性 ${sn.neu} · 正面 ${sn.pos}${sn.none ? ` · 待分析 ${sn.none}` : ""}</div></div>
      <div class="card"><div class="sm mut">最多人谈的话题</div><div style="margin-top:6px">${S.topics.length ? S.topics.slice(0, 5).map((t) => `<span class="tag">${esc(t.topic)} ${t.count}</span>`).join(" ") : "—"}</div></div></div>
    <div class="card"><h3>每天的声量</h3>${bars}</div>
    <h2>来源</h2>${o.sources.length ? `<div class="card scroll" style="padding:6px 10px"><table class="tbl rc"><thead><tr><th>来源</th><th>状态</th><th>最近运行</th><th>内容</th><th>操作</th></tr></thead><tbody>${o.sources.map(row).join("")}</tbody></table></div>`
      : `<div class="card empty"><b>还没有来源。</b><span>先加一个“模拟数据”试用，或接入新闻订阅、App Store 评论、公开网页。</span></div>`}
    <h2>内容</h2><form class="card row" id="mf" style="align-items:flex-end;flex-wrap:wrap">
      <label class="f" style="margin:0"><span>情感</span><select name="sentiment"><option value="">全部</option><option value="neg">负面</option><option value="neu">中性</option><option value="pos">正面</option></select></label>
      <label class="f" style="margin:0"><span>话题</span><select name="topic"><option value="">全部</option>${S.topics.map((t) => `<option>${esc(t.topic)}</option>`).join("")}</select></label>
      <label class="f" style="margin:0"><span>语言</span><select name="lang"><option value="">全部</option>${Object.keys(S.languages).map((l) => `<option value="${l}">${esc(LANGS[l] || l)}</option>`).join("")}</select></label>

      appstore: [["app_id", "App 编号（数字）", ""], ["country", "国家代码", "sg"]], web: [["url", "页面网址", ""], ["item", "每条内容的选择器（如 div.post）", ""], ["text", "正文选择器（在每条内容里，可空）", ""], ["link", "链接选择器（可空）", ""], ["title", "标题选择器（可空）", ""], ["date", "日期选择器（可空）", ""], ["author", "作者选择器（可空，只存哈希）", ""], ["keywords", "只要提到这些词的（逗号隔开，可空）", ""]] };
    const draw = () => { $("#cfg", m).innerHTML = FIELDS[$("#kind", m).value].map(([k, label, def]) => `<label class="f"><span>${esc(label)}</span><input name="c_${k}" value="${esc(def)}"></label>`).join(""); };
    $("#kind", m).onchange = draw; draw();

}

// ---------------- 定量结果：问卷平台推送或手工导入 ----------------
async function quantView(p) {
  const my = renderSeq;
  const o = await api(`/projects/${p.id}/quant`);
  if (stale(my)) return;
  const origin = location.origin;
  const bars = (q, n) => q.type === "open" ? `<p class="mut sm" style="margin:4px 0 0">开放题，没有数值结果</p>` : `${q.mean !== null ? `<p class="sm" style="margin:4px 0">平均分 <b>${q.mean}</b></p>` : ""}${q.results.map((r) => { const tot = q.results.reduce((a, x) => a + x.count, 0) || 1, pct = Math.round((r.count / tot) * 100);
    return `<div class="qrow2"><span>${esc(r.option)}</span><div class="qbar" role="img" aria-label="${esc(r.option)} ${pct}%"><i style="width:${pct}%"></i></div><span class="sm mut">${pct}% · ${r.count}</span></div>`; }).join("")}`;
  const survey = (s) => `<div class="card"><div class="row"><h3 style="margin:0">${esc(s.title)}</h3><span class="sp"></span><span class="tag">${s.source === "api" ? "平台推送" : "手工导入"}</span>${RO ? "" : `<button class="s warn" data-ds="${s.id}">删除</button>`}</div>
    <p class="sm mut" style="margin:4px 0 8px">${s.respondents} 份有效回答 · 更新于 ${esc(new Date(s.updated_at + "Z").toLocaleString())}</p>${s.questions.map((q, i) => `<div style="margin:10px 0"><b>${i + 1}. ${esc(q.text)}</b>${bars(q, i)}</div>`).join("")}</div>`;
  const RO = VIEWER();
  shell(`${head("定量结果", "外部问卷平台把通过甄别的人和问卷结果推送进来（或你手工导入表格），和访谈放在同一个项目里对照着看。", RO ? "" : `<button class="p" id="impq">导入结果表格</button>`)}
    ${RO ? "" : `<div class="card"><h3 style="margin-top:0">接入问卷平台</h3>
      
      <pre class="sm" style="white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all;margin:0 0 8px">POST ${origin}/api/ingest/participants   通过甄别的人（external_id、name、country、language、tags、answers）
POST ${origin}/api/ingest/surveys        问卷的汇总结果（survey_id、title、respondents、questions）
GET  ${origin}/api/ingest/ping           检查密钥</pre>
      ${o.keys.length ? `<table class="tbl rc"><thead><tr><th>名称</th><th>密钥开头</th><th>最近使用</th><th></th></tr></thead><tbody>${o.keys.map((k) => `<tr><td><b>${esc(k.name)}</b>${k.revoked ? ' <span class="tag">已撤销</span>' : ""}</td><td><code>${esc(k.prefix)}…</code></td><td class="mut">${k.last_used_at ? esc(new Date(k.last_used_at + "Z").toLocaleString()) : "还没用过"}</td>
        <td class="acts">${o.can_manage && !k.revoked ? `<button class="s warn" data-rk="${k.id}">撤销</button>` : ""}</td></tr>`).join("")}</tbody></table>` : `<p class="mut sm">还没有密钥。</p>`}
      ${o.can_manage ? `<form id="kf" class="row" style="margin-top:8px"><label class="f" style="margin:0;flex:1"><span>密钥名称（例如“问卷平台”）</span><input name="name" required maxlength="100"></label><button class="p">创建密钥</button></form>` : `<p class="sm mut">只有项目负责人或管理员能创建、撤销密钥。</p>`}</div>`}
    <h2>问卷结果</h2>${o.surveys.length ? o.surveys.map(survey).join("") : `<div class="card empty"><b>还没有问卷结果。</b><span>让问卷平台推送，或点右上角“导入结果表格”（三列：题目、选项、人数）。</span></div>`}`, { active: "quant", p });
  if (RO) return;
  const kf = $("#kf"); if (kf) kf.onsubmit = guard(async (e) => {
    e.preventDefault(); const r = await api(`/projects/${p.id}/quant/keys`, { method: "POST", body: { name: new FormData(kf).get("name") } });
    const m = modal(`<h2>密钥（只显示这一次）</h2><code class="copy">${esc(r.key)}</code><p class="sm mut">丢了只能撤销再建新的。</p><div class="row" style="margin-top:12px"><button class="p" id="done">我已复制</button></div>`);
    $("#done", m).onclick = () => { m.remove(); render(); };

  app.querySelectorAll("[data-rk]").forEach((b) => b.onclick = guard(async () => { if (!confirm("撤销后用这把密钥的平台马上不能再推送。继续？")) return; await api(`/projects/${p.id}/quant/keys/${b.dataset.rk}`, { method: "DELETE" }); toast("已撤销"); render(); }));
  app.querySelectorAll("[data-ds]").forEach((b) => b.onclick = guard(async () => { if (!confirm("删除这份问卷结果？")) return; await api(`/quant/surveys/${b.dataset.ds}`, { method: "DELETE" }); toast("已删除"); render(); }));
  $("#impq").onclick = () => {
    const m = modal(`<h2>导入问卷结果</h2><form id="f"><p class="sm mut">表格三列：题目、选项、人数（首行表头）。同名会替换。</p>
      <label class="f"><span>问卷名称</span><input name="title" required maxlength="200"></label><label class="f"><span>有效回答人数</span><input name="respondents" type="number" min="0" value="0"></label>
      <label class="f"><span>选择文件（.csv）</span><input type="file" id="qfile" accept=".csv,.txt,text/csv"></label>
      <label class="f"><span>或粘贴内容</span><textarea name="csv" rows="8" required placeholder="题目,选项,人数&#10;你听说过 Acme 吗？,听说过,320"></textarea></label>
      <div class="row"><button class="p">导入</button><button type="button" id="c">取消</button></div></form>`);
    $("#c", m).onclick = () => m.remove();
    $("#qfile", m).onchange = async (e) => { const f = e.target.files[0]; if (f) $("[name=csv]", m).value = await f.text(); };
    $("#f", m).onsubmit = guard(async (e) => { e.preventDefault(); const fd = Object.fromEntries(new FormData(e.target)); fd.respondents = Number(fd.respondents || 0); await api(`/projects/${p.id}/quant/surveys/import`, { method: "POST", body: fd }); m.remove(); toast("已导入"); render(); });
  };
}

// ---------------- 洞察池：各种方法的发现放在一起对照 ----------------
const POOL_KIND = { interview: ["访谈", ""], sentiment: ["舆情", "live"], survey: ["问卷", "ok"], note: ["笔记", ""] };
async function poolView(p) {
  const my = renderSeq;
  const o = await api(`/projects/${p.id}/pool`);
  if (stale(my)) return;
  const only = sessionStorage.getItem("pooltri") === "1";
  const fs = o.findings.filter((f) => !only || f.triangulated);
  const card = (f) => `<div class="card"><div class="row" style="align-items:flex-start"><h3 style="margin:0;flex:1">${esc(f.theme)}</h3>${f.kinds.map((k) => `<span class="tag ${POOL_KIND[k][1]}">${POOL_KIND[k][0]}</span>`).join(" ")}${f.triangulated ? ` <span class="tag ok" title="至少两种来源都说到了这件事">已印证</span>` : ""}</div>
    <ul class="feed" style="margin:8px 0 0">${f.items.map((i) => `<li><span class="tag ${POOL_KIND[i.kind][1]}">${POOL_KIND[i.kind][0]}</span><span>${esc(i.text)}${i.interview_id ? ` <a class="sm" href="#/i/${i.interview_id}">打开访谈 →</a>` : ""}${i.kind === "note" ? ` <button class="s warn" data-dn="${i.ref}">删除</button>` : ""}</span></li>`).join("")}</ul></div>`;
  const RO = VIEWER();
  shell(`${head("洞察池", "访谈里研究员确认过的洞察、公开渠道上的话题、问卷结果" + (RO ? "" : "和团队自己的笔记") + "，按主题放在一起。被两种以上来源都说到的，标为“已印证”。", RO ? `<button class="p" id="rep">下载研究报告（Word）</button>` : "")}
    <div class="grid"><div class="card"><div class="sm mut">访谈洞察</div><div class="big">${o.counts.interview}</div></div><div class="card"><div class="sm mut">舆情话题</div><div class="big">${o.counts.sentiment}</div></div>
      <div class="card"><div class="sm mut">问卷题目</div><div class="big">${o.counts.survey}</div></div><div class="card"><div class="sm mut">已印证的发现</div><div class="big">${o.triangulated}</div></div></div>
    <label class="chk"><input type="checkbox" id="tri"${only ? " checked" : ""}><span>只看被多种来源印证的</span></label>
    ${fs.length ? fs.map(card).join("") : `<div class="card empty"><b>${only ? "还没有被多种来源印证的发现。" : "洞察池还是空的。"}</b><span>在“洞察与片段”里通过洞察、在“舆情监测”里运行来源、或接入问卷结果，它们会自动出现在这里。</span></div>`}
    ${RO ? "" : `<div class="card"><h3 style="margin-top:0">加一条笔记</h3><form id="nf" class="row" style="align-items:flex-end;flex-wrap:wrap"><label class="f" style="margin:0;flex:1 1 160px"><span>主题（和上面同样的词会自动并在一起）</span><input name="theme" required maxlength="200"></label>
      <label class="f" style="margin:0;flex:2 1 260px"><span>内容</span><input name="text" required maxlength="2000"></label><button class="p">添加</button></form></div>`}`, { active: "pool", p });
  const rb = $("#rep"); if (rb) rb.onclick = guard(async () => {
    const r = await fetch(`/api/projects/${p.id}/report?format=docx`, { headers: { Authorization: "Bearer " + store.get("tt_token") } });
    if (!r.ok) throw new Error("生成报告失败，请稍后再试");
    const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob()); a.download = `${p.name}-研究报告.docx`; document.body.appendChild(a); a.click(); a.remove();
  });
  $("#tri").onchange = (e) => { sessionStorage.setItem("pooltri", e.target.checked ? "1" : "0"); render(); };
  if (!RO) $("#nf").onsubmit = guard(async (e) => { e.preventDefault(); await api(`/projects/${p.id}/pool/notes`, { method: "POST", body: Object.fromEntries(new FormData(e.target)) }); toast("已添加"); render(); });
  app.querySelectorAll("[data-dn]").forEach((b) => b.onclick = guard(async () => { if (!confirm("删除这条笔记？")) return; await api(`/pool/notes/${b.dataset.dn}`, { method: "DELETE" }); render(); }));
}

async function membersView(p) {  // who works on this project and in which research stages (admins see every project; moderators and observers are assigned per interview)
  const my = renderSeq;
  const [d, us] = await Promise.all([api(`/projects/${p.id}/members`), api("/users")]);
  if (stale(my)) return;
  const inProject = new Set(d.members.map((m) => m.user_id));
  const candidates = us.filter((u) => ["researcher", "support", "recruiter", "viewer"].includes(u.role) && u.active && !inProject.has(u.id));
  const stageName = Object.fromEntries(d.stages.map((s) => [s.key, s.label]));
  const roleName = (m) => (m.role === "researcher" ? { quant: "定量研究员", qual: "定性研究员", all: "全科研究员" }[m.research_kind || "all"] : ROLE[m.role]);
  const defaults = (u) => {  // the stages a person gets by role (the same rule the server uses; the person adding can change it)
    const all = d.stages.map((s) => s.key), k = u.research_kind || "all";
    const want = ["admin", "viewer", "support"].includes(u.role) ? all : u.role === "researcher" ? (k === "quant" ? ["quant", "listening"] : k === "qual" ? ["depth", "group", "listening", "async"] : all) : [];
    return all.filter((x) => want.includes(x));
  };
  const stageBox = (on) => `<div class="stagebox"><div class="sm mut">本项目的研究阶段（可多选）</div>${d.stages.map((s, i) => `<label class="chk"><input type="checkbox" name="scopes" value="${s.key}" ${on.includes(s.key) ? "checked" : ""}><span><b>${s.label}</b>${s.where.length ? ` <span class="mut sm">${esc(s.where.join("、"))}</span>` : ""}</span></label>`).join("") || '<p class="sm mut" style="margin:0">这个项目还没有研究阶段。</p>'}</div>`;
  const row = (m) => `<tr><td><b>${esc(m.name)}</b>${m.role !== "researcher" ? ` <span class="tag">${roleName(m)}</span>` : ` <span class="tag">${roleName(m)}</span>`}${m.user_id === ME.id ? ' <span class="tag">我</span>' : ""}${m.active ? "" : ' <span class="tag">已停用</span>'}</td><td class="mut">${esc(m.email)}</td>
      <td>${m.is_owner ? '<span class="tag ok">项目负责人</span>' : '<span class="tag">成员</span>'}</td>
      <td>${(m.scopes || []).length ? m.scopes.filter((k) => stageName[k]).map((k) => `<span class="tag o nw">${stageName[k]}</span>`).join("") : '<span class="mut sm">未指定</span>'}</td>
      <td class="acts">${d.can_manage ? `<button class="s" data-scopes="${m.user_id}">改阶段</button> <button class="s" data-owner="${m.user_id}" data-to="${m.is_owner ? 0 : 1}">${m.is_owner ? "取消负责人" : "设为负责人"}</button> <button class="s warn" data-rm="${m.user_id}">移出项目</button>` : ""}</td></tr>`;
  shell(`${head("项目成员", "只有加入这个项目的研究员才能看到它。管理员可以看到所有项目（自动参与全部阶段）；主持人和观察员（客户）按场次指派，不在这里设置。", d.can_manage ? `<button class="p" id="addmem" type="button">添加项目成员</button>` : "")}
    <div class="card scroll" style="padding:6px 10px"><table class="tbl rc"><thead><tr><th>姓名</th><th>邮箱</th><th>身份</th><th>负责的阶段</th><th>操作</th></tr></thead><tbody>${d.members.map(row).join("")}</tbody></table></div>
    ${d.can_manage ? "" : `<div class="note">只有项目负责人或管理员能添加和移出成员。</div>`}`, { active: "members", p });
  const redo = guard(async (path, opts) => { const r = await api(path, opts); if (r.left) { toast("你已离开这个项目"); location.hash = "#/projects"; return; } toast("已更新"); render(); });
  const am = $("#addmem"); if (am) am.onclick = () => {
    const m = modal(`<h2>添加项目成员</h2>${candidates.length ? `<form id="addm"><label class="f"><span>选择同事（研究员、技术支持、项目经理或客户）</span><select name="user_id" required>${candidates.map((u) => `<option value="${u.id}">${esc(u.name)}（${roleName(u)} · ${esc(u.email)}）</option>`).join("")}</select></label>
        <div id="stg">${stageBox(defaults(candidates[0]))}</div><div class="row" style="margin-top:14px"><button class="p">添加</button><button type="button" id="amc">取消</button></div></form>`
      : `<p class="mut">公司里没有可以添加的同事了。请管理员先在“团队”里添加用户并赋予身份。</p><div class="row"><button type="button" id="amc">知道了</button></div>`}`);
    $("#amc", m).onclick = () => m.remove();
    const f = $("#addm", m);
    if (f) {
      f.querySelector("select[name=user_id]").onchange = (e) => { $("#stg", m).innerHTML = stageBox(defaults(candidates.find((u) => u.id === e.target.value))); };
      f.onsubmit = (e) => { e.preventDefault(); const fd = new FormData(f), uid = fd.get("user_id"), scopes = fd.getAll("scopes"); m.remove(); redo(`/projects/${p.id}/members`, { method: "POST", body: { user_id: uid, scopes } }); };
    }
  };
  app.querySelectorAll("[data-scopes]").forEach((b) => b.onclick = () => {
    const mem = d.members.find((x) => x.user_id === b.dataset.scopes);

// A long task runs in the background: start it, then ask every 2 s how it is going (resolves with the result, throws the job's plain message if it failed).
async function runJob(iid, kind) {
  let j = await api(`/interviews/${iid}/jobs`, { method: "POST", body: { kind } });
  for (let n = 0; n < 300 && (j.status === "queued" || j.status === "running"); n++) {
    await new Promise((r) => setTimeout(r, 2000));
    j = await api(`/jobs/${j.id}`);
  }
  if (j.status === "failed") throw new Error(j.error || "任务失败");
  if (j.status !== "done") throw new Error("任务还没有完成，请稍后刷新查看");
  return j.result || {};
}

    $("#f", m).onsubmit = guard(async (ev) => {

const MATERIAL = { ad_film: "广告片", concept_a: "概念 A", concept_b: "概念 B", ad_film_2: "备用广告片" };
async function signalsTab(iid, my) {  // how things were said (pace, pauses, volume, tone of the words) and emoji reactions: hints against each person's own habits
  const d = await api(`/interviews/${iid}/signals`);
  if (stale(my) || !$("#tab")) return;
  const tagName = { hesitation: "回答前停顿长", slow: "语速偏慢", fast: "语速偏快", quiet: "声音偏轻", loud: "声音偏大", negative: "偏负面", positive: "偏正面" };
  const tags = (o) => Object.entries(o).map(([k, n]) => `${esc(tagName[k] || k)} ${n}`).join("、") || "—";
  const reacts = (o) => Object.entries(o).map(([k, n]) => `<span class="emo">${esc(k)}</span> ${n}`).join("　") || "—";   // the keys are the emoji themselves
  const mat = Object.entries(d.stimuli);
  $("#tab").innerHTML = `<div class="card"><h3>情绪信号</h3><p class="sm mut">${esc(d.note)}</p>
    ${d.speakers.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>谁</th><th>句数</th><th>词句的整体倾向</th><th>标记</th><th>表情反应</th></tr></thead><tbody>
      ${d.speakers.map((s) => `<tr><td><b>${esc(s.who)}</b></td><td>${s.sentences}</td><td>${s.tone > 0.15 ? "偏正面" : s.tone < -0.15 ? "偏负面" : "中性"}（${s.tone.toFixed(2)}）</td><td>${tags(s.tags)}</td><td>${reacts(s.reactions)}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="mut">这场访谈还没有实时字幕或表情反应。</p>`}</div>
    <div class="card"><h3>值得回看的时刻（${d.moments.length}）</h3>${d.moments.length ? d.moments.map((m) => `<div class="sig-moment"><div class="sm mut">${fmt(m.at_ms)} · ${esc(m.who)}</div><div>${esc(m.text)}</div><div class="sm hint">${esc(m.hints.join(" · "))}</div></div>`).join("") : `<p class="mut">暂时没有。</p>`}</div>
    ${mat.length ? `<div class="card"><h3>各素材的表情反应</h3>${mat.map(([k, o]) => `<p><b>${esc(MATERIAL[k] || k)}</b>：${reacts(o)}</p>`).join("")}</div>` : ""}`;
}

async function clipsTab(iid, staff, my) {
  const [clips, recs] = await Promise.all([api(`/interviews/${iid}/clips`), staff ? api(`/interviews/${iid}/recordings`) : []]);

  app.querySelectorAll("[data-pv]").forEach((b) => b.onclick = guard(async () => {

      $("#cx", m).onclick = () => m.remove();
      const v = $("#cv", m); v.addEventListener("loadeddata", () => { $("#pvmsg", m).textContent = "这就是客户通过分享链接看到的样子（带水印，不能下载）。"; });
      v.addEventListener("error", () => { $("#pvmsg", m).textContent = "视频暂时无法播放：可能还在剪辑，或这个浏览器不支持。可以关闭后重试，或换 Chrome / Safari。"; });

    box.hidden = false;
    box.innerHTML = rows.length ? rows.map((x) => `<div class="row sm" style="padding:8px 0;margin-top:8px;border-top:1px solid var(--line)"><span>${x.revoked ? `<span class="tag bad">已撤销</span>` : new Date(x.expires_at + "Z") < new Date() ? `<span class="tag">已过期</span>` : `<span class="tag ok">有效</span>`}</span><span class="mut">到期 ${esc(new Date(x.expires_at + "Z").toLocaleString())} · 被打开 ${x.views} 次 · 水印“${esc(x.watermark)}”</span><span class="sp"></span>${x.revoked ? "" : `<button class="s warn" data-rv="${x.id}" data-c="${cid}">撤销</button>`}</div>`).join("") : `<div class="sm mut" style="margin-top:8px">还没有创建过分享链接。</div>`;
    box.querySelectorAll("[data-rv]").forEach((b) => b.onclick = guard(async () => { if (confirm("撤销后，这条链接立刻打不开。")) { await api(`/shares/${b.dataset.rv}`, { method: "DELETE" }); toast("已撤销"); loadShares(b.dataset.c); } }));
  };
  app.querySelectorAll("[data-sl]").forEach((b) => b.onclick = guard(async () => { const box = document.getElementById("sl_" + b.dataset.sl); if (!box.hidden) { box.hidden = true; return; } await loadShares(b.dataset.sl); }));
  app.querySelectorAll("[data-sh]").forEach((b) => b.onclick = guard(async () => {
    const r = await api(`/clips/${b.dataset.sh}/share`, { method: "POST", body: { expires_hours: 72 } });
    const url = location.origin + r.path;
    modal(`<h2>分享链接</h2><code class="copy">${esc(url)}</code><p class="sm mut" style="margin:8px 0 0">72 小时后失效，页面带水印“${esc(r.watermark)}”。只显示这一次。</p>`);
  }));
}

      <div class="row"><button class="p">添加</button><button type="button" id="c">取消</button></div></form>`);
    $("#c", m).onclick = () => m.remove(); wireRole(m);
    $("#f", m).onsubmit = guard(async (e) => { e.preventDefault(); await api("/users", { method: "POST", body: splitRole(Object.fromEntries(new FormData(e.target))) }); m.remove(); render(); });
  };
  document.querySelectorAll("[data-role]").forEach((el) => el.onchange = guard(async () => {
    const [role, kind] = el.value.split("|"), uid = el.dataset.role;
    try {
      if (role !== "viewer") { await api(`/users/${uid}`, { method: "PATCH", body: kind ? { role, research_kind: kind } : { role } }); return; }
      await new Promise((done) => {  // becoming a client: choose the brand first
        const m = modal(`<h2>改为客户</h2><form id="f">${clientFields.replace(" hidden", "")}<div class="row"><button class="p">确定</button><button type="button" id="c">取消</button></div></form>`);
        $("#c", m).onclick = () => { m.remove(); done(); };
        $("#f", m).onsubmit = guard(async (e) => { e.preventDefault(); const fd = Object.fromEntries(new FormData(e.target)); await api(`/users/${uid}`, { method: "PATCH", body: { role, ...fd } }); m.remove(); done(); });
      });
    } finally { render(); }
  }));
  document.querySelectorAll("[data-act]").forEach((b) => b.onclick = guard(async () => { await api(`/users/${b.dataset.act}`, { method: "PATCH", body: { active: b.dataset.to === "1" } }); render(); }));
  document.querySelectorAll("[data-reset]").forEach((b) => b.onclick = guard(async () => showLink(await api(`/users/${b.dataset.reset}/reset-link`, { method: "POST" }), "重置密码链接")));
  document.querySelectorAll("[data-resetmail]").forEach((b) => b.onclick = guard(async () => showLink(await api(`/users/${b.dataset.resetmail}/reset-link?send_email=true`, { method: "POST" }), "重置密码链接")));
  document.querySelectorAll("[data-rv]").forEach((b) => b.onclick = guard(async () => { await api(`/users/invites/${b.dataset.rv}`, { method: "DELETE" }); render(); }));
}

async function auditView() {
  if (ME.role !== "admin") { location.hash = "#/projects"; return; }
  const F = { action: "", actor: "", since: "", until: "" };
  shell(`${head("审计日志", "谁在什么时候做了什么。可以按动作、操作者、日期筛选，也可以导出 CSV（导出本身也会被记录）。", `<button class="s" id="aexp">导出 CSV</button>`)}
    <form class="card row" id="af" style="align-items:flex-end;flex-wrap:wrap">
      <label class="f" style="margin:0;flex:1 1 150px"><span>动作开头（如 insight. 或 project.）</span><input name="action" maxlength="60"></label>
      <label class="f" style="margin:0;flex:1 1 130px"><span>操作者包含</span><input name="actor" maxlength="80"></label>
      <label class="f" style="margin:0"><span>从</span><input name="since" type="date"></label><label class="f" style="margin:0"><span>到</span><input name="until" type="date"></label><button class="p">筛选</button></form>
    <div class="card scroll" style="padding:6px 10px"><table class="tbl rc"><thead><tr><th>时间</th><th>动作</th><th>操作者</th><th>详情</th></tr></thead><tbody id="arows"></tbody></table></div>
    <div class="pager" id="apg" role="navigation" aria-label="翻页"></div>`, { active: "audit", title: "审计日志" });
  const PAGE = 15; let page = 0, total = 0;
  const qs = (extra = {}) => new URLSearchParams(Object.fromEntries(Object.entries({ ...F, ...extra }).filter(([, v]) => v !== "" && v !== undefined)));
  const row = (r) => `<tr><td class="mut" style="white-space:nowrap" data-l="时间">${esc(new Date(r.at + "Z").toLocaleString())}</td><td data-l="动作">${esc(r.action)}</td><td class="mut code" data-l="操作者">${esc(r.actor)}</td><td class="mut code" data-l="详情">${esc(JSON.stringify(r.meta))}</td></tr>`;
  const pageList = (n) => { const s = new Set([0, n - 1, page - 1, page, page + 1].filter((x) => x >= 0 && x < n)); const out = []; let prev = -1; [...s].sort((x, y) => x - y).forEach((x) => { if (x - prev > 1) out.push("…"); out.push(x); prev = x; }); return out; };
  const drawPager = () => {
    const n = Math.max(1, Math.ceil(total / PAGE));
    $("#apg").innerHTML = total ? `<span class="sm mut" id="acount" role="status">共 ${total} 条</span><button class="s" data-pg="${page - 1}" ${page ? "" : "disabled"}>上一页</button>${pageList(n).map((x) => (x === "…" ? `<span class="mut">…</span>` : `<button class="s ${x === page ? "on" : ""}" data-pg="${x}" ${x === page ? 'aria-current="page"' : ""}>${x + 1}</button>`)).join("")}<button class="s" data-pg="${page + 1}" ${page < n - 1 ? "" : "disabled"}>下一页</button>` : `<span class="sm mut" id="acount" role="status">没有符合条件的记录</span>`;
  };
  const load = guard(async (reset) => {
    if (reset) { page = 0; total = (await api(`/audit/count?${qs()}`)).total; }
    const rows = await api(`/audit?${qs({ limit: PAGE, offset: page * PAGE })}`);
    $("#arows").innerHTML = rows.map(row).join("");
    drawPager();
  });
  $("#af").onsubmit = (e) => { e.preventDefault(); Object.assign(F, Object.fromEntries(new FormData(e.target))); load(true); };
  $("#apg").onclick = (e) => { const b = e.target.closest("[data-pg]"); if (b && !b.disabled) { page = +b.dataset.pg; load(false); } };
  $("#aexp").onclick = guard(async () => {
    const r = await fetch(`/api/audit/export?${qs()}`, { headers: { Authorization: "Bearer " + store.get("tt_token") } });
    if (!r.ok) throw new Error("导出失败，请稍后再试");
    const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob()); a.download = "audit.csv"; document.body.appendChild(a); a.click(); a.remove();
  });
  load(true);
}

// ---------------- 数据保留：什么时候删、现在有多少、延后或立即清除 ----------------
async function dataView() {
  if (ME.role !== "admin") { location.hash = "#/projects"; return; }
  const my = renderSeq;
  const o = await api("/admin/data");
  if (stale(my)) return;
  const day = (t) => (t ? new Date(t + "Z").toLocaleDateString() : "—");
  const holds = (h) => `访谈 ${h.interviews} · 受访者 ${h.participants} · 公开内容 ${h.mentions} · 文档 ${h.documents}`;
  const row = (p) => `<tr><td data-l="项目"><b>${esc(p.name)}</b></td><td data-l="结项">${p.closed_at ? esc(day(p.closed_at)) : `<span class="tag">未结项</span>`}</td>
    <td data-l="删除日期">${p.purge_at ? `${esc(day(p.purge_at))}<div class="sm mut">还剩 ${p.days_left} 天${p.hold_until ? " · 已延后" : ""}</div>` : `<span class="mut">结项后 ${o.retention_days} 天</span>`}</td><td class="mut" data-l="现在保有">${esc(holds(p.holds))}</td>
    <td class="acts" data-l="操作">${p.closed_at ? `<button class="s" data-hold="${p.id}">延后</button> ${p.hold_until ? `<button class="s" data-rel="${p.id}">取消延后</button> ` : ""}<button class="s warn" data-now="${p.id}" data-name="${esc(p.name)}">立即清除</button>` : ""}</td></tr>`;
  shell(`${head("数据保留", `个人数据在项目结项 ${o.retention_days} 天后删除，洞察结论保留。`)}
    <div class="card scroll" style="padding:6px 10px"><table class="tbl rc"><thead><tr><th>项目</th><th>结项</th><th>删除日期</th><th>现在保有</th><th>操作</th></tr></thead><tbody>${o.projects.length ? o.projects.map(row).join("") : `<tr><td colspan="5" class="mut">还没有项目。</td></tr>`}</tbody></table></div>`, { active: "retention", title: "数据保留" });
  app.querySelectorAll("[data-hold]").forEach((b) => b.onclick = () => {
    const m = modal(`<h2>延后删除</h2><form id="f"><label class="f"><span>在原定删除日期之后再保留多久？</span><select name="days"><option value="30">30 天</option><option value="90">90 天</option><option value="180">180 天</option><option value="365">365 天</option></select></label>
      <div class="row"><button class="p">延后</button><button type="button" id="c">取消</button></div></form>`);
    $("#c", m).onclick = () => m.remove();
    $("#f", m).onsubmit = guard(async (e) => { e.preventDefault(); await api(`/admin/data/${b.dataset.hold}/hold`, { method: "POST", body: { days: Number(e.target.days.value) } }); m.remove(); toast("已延后"); render(); });
  });
  app.querySelectorAll("[data-rel]").forEach((b) => b.onclick = guard(async () => { await api(`/admin/data/${b.dataset.rel}/hold`, { method: "DELETE" }); toast("已取消延后"); render(); }));
  app.querySelectorAll("[data-now]").forEach((b) => b.onclick = () => {
    const m = modal(`<h2>立即清除个人数据</h2><form id="f"><p>会永久删除「${esc(b.dataset.name)}」的录像、转写、引文、片段、聊天、没访谈过的人、采集的公开内容和导入的项目文档。<b>无法恢复。</b>洞察结论保留。</p>
      <label class="f"><span>请输入项目名称确认</span><input name="confirm" required autocomplete="off"></label><p class="sm" id="perr" role="alert" hidden style="color:#A8203E"></p>
      <div class="row"><button class="p warn" id="go2">永久删除</button><button type="button" id="c">取消</button></div></form>`);
    $("#c", m).onclick = () => m.remove();
    $("#f", m).onsubmit = async (e) => {
      e.preventDefault();
      try { const r = await api(`/admin/data/${b.dataset.now}/purge`, { method: "POST", body: { confirm: e.target.confirm.value } }); m.remove(); toast(`已清除 ${r.purged_interviews} 场访谈的个人数据`); render(); }
      catch (err) { const p = $("#perr", m); p.textContent = err.message; p.hidden = false; }
    };
  });
}
