        bad: "தவறான இணைப்பு", badp: "இந்த அழைப்பு இணைப்பு இல்லை அல்லது காலாவதியாகிவிட்டது. உங்களை அழைத்தவரிடம் புதிய இணைப்பைக் கேளுங்கள்." },
};
const pub = (path, opt = {}) => api(`/public/join/${encodeURIComponent(t)}${path}`, { auth: false, ...opt });
const AL = {  // a study done alone, in writing, at any time: no device test, no waiting room
  en: { step: "Your interview", how: "This is a written conversation with an AI interviewer. Do it at any time that suits you; it usually takes 15 to 30 minutes. No camera or microphone is needed, and you can pause and come back with this same link.", accept: "Accept and continue" },
  zh: { step: "开始访谈", how: "这是一场和 AI 访谈员的文字对话，可以在任何方便的时间完成，通常需要 15 到 30 分钟。不需要摄像头和麦克风，中途可以暂停，用同一个链接回来继续。", accept: "接受并继续" },
  ms: { step: "Temu bual anda", how: "Ini ialah perbualan bertulis dengan penemu bual AI. Lakukan pada bila-bila masa yang sesuai; biasanya mengambil masa 15 hingga 30 minit. Tiada kamera atau mikrofon diperlukan, dan anda boleh berhenti seketika dan kembali dengan pautan yang sama.", accept: "Terima dan teruskan" },
  ta: { step: "உங்கள் நேர்காணல்", how: "இது AI நேர்காணலருடன் எழுத்து உரையாடல். உங்களுக்கு வசதியான எந்த நேரத்திலும் செய்யலாம்; பொதுவாக 15 முதல் 30 நிமிடங்கள் ஆகும். கேமரா அல்லது மைக்ரோஃபோன் தேவையில்லை; இடையில் நிறுத்தி அதே இணைப்பில் திரும்பலாம்.", accept: "ஏற்றுத் தொடரவும்" },
};
let info, x, STEPS = [], IX = {};

function buildFlow() {  // the pre-task step only exists when the research team configured questions (opt-in per interview)
  if (info.async) { STEPS = [x.steps[0], x.steps[2], (AL[info.consent.lang] || AL.en).step]; IX = { invite: 0, consent: 1 }; return; }
  const hasPre = !!(info.pretask && info.pretask.questions.length);
  STEPS = hasPre ? [x.steps[0], x.steps[1], x.steps[2], x.pre, x.steps[3], x.steps[4]] : x.steps.slice();
  IX = hasPre ? { invite: 0, device: 1, consent: 2, pre: 3, wait: 4 } : { invite: 0, device: 1, consent: 2, wait: 3 };
}

function afterConsent() {  // consent done: fill in the pre-task if there is one, otherwise go straight to the waiting room
  if (info.async) { location.href = `/async.html?t=${encodeURIComponent(t)}`; return; }  // a study done alone: straight into the written conversation
  if (IX.pre !== undefined && !(info.pretask && info.pretask.done)) return preStep();
  waitStep();
}

function frame(step, inner) {  // step bar: done = green, current = orange
  document.body.classList.toggle("join-preparation", step === IX.device);
  const N = STEPS.length;
  box.innerHTML = `<div class="psteps" aria-hidden="true">${STEPS.map((_, i) => `<i class="${i < step ? "done" : i === step ? "on" : ""}"></i>`).join("")}</div>
    <p class="pstep">${esc(x.stepOf.replace("{n}", step + 1).replace("{N}", N))} · ${esc(STEPS[step])}</p>${inner}`;
  window.scrollTo(0, 0);
}

// ---------- 0a. choose a time (only when the research team offered candidate times) ----------
function voteStep() {  // a focus group: tick every time that suits you; the team confirms one, and this page moves on by itself
  const T = info.timeslots, voted = T.voted;
  frame(IX.invite, `<h1>${x.pickTime}</h1><p class="mut">${esc(x.by.replace("{o}", info.org))}</p>
    <form class="card" id="tf">${T.slots.map((s) => `<label class="chk"><input type="checkbox" name="slot" value="${s.id}"${s.mine ? " checked" : ""}><span>${esc(new Date(s.start_at + "Z").toLocaleString())}<br><span class="sm mut">${esc(x.voteN.replace("{n}", s.votes))}</span></span></label>`).join("")}
    <p class="mut sm" style="margin:6px 0 0">${esc(x.voteIntro)}</p>${voted ? `<p class="sm" role="status" style="margin:10px 0 0"><b>${esc(x.voteDone)}</b></p>` : ""}
    <p class="sm" id="verr" role="alert" hidden style="color:var(--risk-ink);margin:8px 0 0"></p><button class="p pbig" style="margin-top:14px">${x.voteGo}</button></form>`);
  const f = $("#tf");
  f.onsubmit = guard(async (e) => {
    e.preventDefault();
    const ids = [...f.querySelectorAll("input[name=slot]:checked")].map((c) => c.value);
    if (!ids.length) { const er = $("#verr"); er.textContent = x.voteIntro; er.hidden = false; return; }
    await pub("/slot", { method: "POST", body: { slot_ids: ids } });
    info = await pub(""); voteStep();
  });
  clearInterval(voteTimer);
  if (voted) voteTimer = setInterval(async () => {   // the team confirmed the time: move on to the invitation
    try { const i2 = await pub(""); if (!i2.timeslots) { clearInterval(voteTimer); info = i2; inviteStep(); } } catch {}
  }, 8000);
}
let voteTimer = null;

function timeStep() {
  const slots = info.timeslots.slots;
  frame(IX.invite, `<h1>${x.pickTime}</h1><p class="mut">${esc(x.by.replace("{o}", info.org))}</p>
    <form class="card" id="tf">${slots.map((s) => `<label class="chk"><input type="radio" name="slot" value="${s.id}" required><span>${esc(new Date(s.start_at + "Z").toLocaleString())}</span></label>`).join("")}
    <p class="mut sm" style="margin:6px 0 0">${esc(x.pickIntro)}</p><button class="p pbig" style="margin-top:14px">${x.pickGo}</button>
    <p class="sm mut" style="margin:12px 0 0">${x.decline}</p></form>`);
  const f = $("#tf");
  f.onsubmit = guard(async (e) => {
    e.preventDefault();
    await pub("/slot", { method: "POST", body: { slot_id: new FormData(f).get("slot") } });
    info = await pub("");  // refetch so the confirmed time and the entry window are correct
    inviteStep();
  });
}

// ---------- 0. invitation ----------
function inviteStep() {
  if (info.timeslots && info.timeslots.group) return voteStep();
  if (info.timeslots && info.timeslots.slots.length) return timeStep();  // a time must be chosen before anything else
  if (info.async) {
    const a = AL[info.consent.lang] || AL.en;
    frame(IX.invite, `<h1>${x.invite}</h1><p class="mut">${esc(x.by.replace("{o}", info.org))}</p><div class="card"><p>${esc(a.how)}</p></div>
      <button class="p pbig" id="accept">${esc(a.accept)}</button><p class="sm mut" style="margin-top:12px">${x.decline}</p>`);
    $("#accept").onclick = () => consentStep();
    return;
  }
  const when = info.scheduled_at ? new Date(info.scheduled_at + "Z").toLocaleString() : "";
  frame(IX.invite, `<h1>${x.invite}</h1><p class="mut">${esc(x.by.replace("{o}", info.org))}</p>
    <div class="card"><p><b>${esc(when ? x.time.replace("{t}", when) : x.timeTbd)}</b></p><p>${esc(x.how)}</p><p class="mut" style="margin:0">${esc(x.next)}</p></div>
    <button class="p pbig" id="accept">${x.accept}</button><p class="sm mut" style="margin-top:12px">${x.decline}</p>`);
  $("#accept").onclick = () => deviceStep();
}

// ---------- 1. device test ----------
let devStream = null;
function stopDev() { if (devStream) { devStream.getTracks().forEach((k) => k.stop()); devStream = null; } }
function deviceStep() {
  frame(IX.device, `<h1>${x.dev}</h1><p class="mut">${esc(x.devIntro)}</p>
    <video id="devv" muted playsinline autoplay style="width:100%;aspect-ratio:16/9;background:#0E1A16;border-radius:14px;margin:0 0 12px;object-fit:cover" hidden></video>
    ${["cam", "mic", "spk", "net"].map((k) => `<div class="pcheck" id="c_${k}"><span>${x[k]}</span>${k === "mic" ? `<span class="lvl" aria-hidden="true"><i id="lvl"></i></span>` : ""}<span class="st">${x.checking}</span></div><p class="perr sm" id="e_${k}" role="alert" hidden></p>`).join("")}
    <div class="row"><button id="play">${x.play}</button><button id="devretry">${x.retry}</button></div>
    <p class="perr sm" id="micwarn" role="alert" hidden>${esc(x.micWarn)}</p>
    <button class="p pbig" id="devnext" disabled>${x.cont}</button>`);
  // Recompose the existing tested controls; consent remains a separate required server-checked step.
  const layout = document.createElement("div"); layout.className = "join-device-layout";
  const preview = document.createElement("section"); preview.className = "join-device-preview";
  const screen = document.createElement("div"); screen.className = "join-preview-screen";
  screen.innerHTML = `<svg class="join-person" viewBox="0 0 80 100" aria-hidden="true"><circle cx="40" cy="26" r="15"/><path d="M12 92v-9c0-38 56-38 56 0v9"/></svg>`;
  screen.append($("#devv")); preview.append(screen);
  const panel = document.createElement("aside"); panel.className = "join-device-panel";
  const heading = box.querySelector("h1"), intro = heading && heading.nextElementSibling;
  if (heading) panel.append(heading); if (intro) panel.append(intro);
  if (info.scheduled_at) { const schedule = document.createElement("p"); schedule.className = "mut"; schedule.textContent = new Date(info.scheduled_at + "Z").toLocaleString(); panel.append(schedule); }
  ["cam", "mic", "spk", "net"].forEach((k) => { preview.append($("#c_" + k)); preview.append($("#e_" + k)); });
  preview.append($("#play").parentElement);
  panel.append($("#micwarn")); panel.append($("#devnext"));
  layout.append(preview, panel); box.append(layout);
  const R = { camera: false, microphone: false, speaker: false };
  const set = (k, ok, fix) => { const el = $("#c_" + k); el.className = "pcheck " + (ok ? "ok" : "bad"); $(".st", el).textContent = ok === "played" ? x.played : ok ? x.ok : x.fail; const e = $("#e_" + k); e.hidden = !!ok; e.textContent = ok ? "" : fix; };
  $("#play").onclick = () => {
    try { const ac = new (window.AudioContext || window.webkitAudioContext)(), o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 660; g.gain.value = .12; o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + .5); R.speaker = true; set("spk", "played"); }
    catch { set("spk", false, x.spkFix); }
  };
  const run = async () => {
    stopDev(); $("#devnext").disabled = true;
    ["cam", "mic", "net"].forEach((k) => { const el = $("#c_" + k); el.className = "pcheck"; $(".st", el).textContent = x.checking; $("#e_" + k).hidden = true; });
    if (!R.speaker) { $(".st", $("#c_spk")).textContent = ""; $("#e_spk").hidden = false; $("#e_spk").textContent = x.spkFix; $("#e_spk").className = "sm mut"; }
    const md = navigator.mediaDevices;
    try { devStream = await md.getUserMedia({ audio: true, video: true }); }
    catch { try { devStream = await md.getUserMedia({ audio: true }); } catch { devStream = null; } }
    R.camera = !!devStream && devStream.getVideoTracks().length > 0;
    R.microphone = !!devStream && devStream.getAudioTracks().length > 0;
    set("cam", R.camera, x.camFix); set("mic", R.microphone, x.micFix);
    const v = $("#devv"); v.hidden = !R.camera; if (R.camera) v.srcObject = devStream;
    if (R.microphone) {  // live level bar, so people can see the microphone hears them
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)(), an = ac.createAnalyser(); ac.createMediaStreamSource(devStream).connect(an);
        const buf = new Uint8Array(an.fftSize);
        const loop = () => { if (!devStream || !$("#lvl")) return; an.getByteTimeDomainData(buf); let m = 0; for (const b of buf) m = Math.max(m, Math.abs(b - 128)); $("#lvl").style.width = Math.min(100, m * 1.6) + "%"; requestAnimationFrame(loop); };
        loop();
      } catch {}
    }
    const t0 = performance.now(); let netOk = false;
    try { await fetch("/api/health", { cache: "no-store" }); netOk = performance.now() - t0 < 1500; } catch {}
    set("net", netOk, x.netFix);
    $("#micwarn").hidden = R.microphone;
    $("#devnext").disabled = !R.microphone;  // decision 2026-10-10: the device test must pass (a working microphone; the camera may stay off)
    pub("/device", { method: "POST", body: R }).catch(() => {});  // the research team sees the result, passed or not
  };
  $("#devretry").onclick = guard(run);
  $("#devnext").onclick = guard(async () => {
    if (!R.microphone) return;
    stopDev();
    const r = await pub("/device", { method: "POST", body: R });
    info.device_ok = r.passed;
    if (r.passed) consentStep();
  });
  run();
}

// ---------- 2. privacy & consent ----------
function consentStep() {
  const c = info.consent;
  frame(IX.consent, `<form class="card" id="f"><h1 style="margin-bottom:10px">${x.before}</h1><p>${esc(c.text)}</p>
    <label class="f"><span>${x.where}</span><select name="country" required><option value="">${x.pick}</option>${countryOpts("")}</select></label>
    ${Object.keys(c.labels).map((k) => `<label class="chk"><input type="checkbox" name="${k}"><span>${esc(c.labels[k])}</span></label>`).join("")}
    <button class="p pbig">${x.go}</button><p class="sm mut" style="margin:12px 0 0">${x.skip}</p></form>`);
  const f = $("#f");
  f.onsubmit = guard(async (e) => {
    e.preventDefault();
    const fd = new FormData(f);
    const agreed = Object.fromEntries(Object.keys(c.labels).map((k) => [k, !!fd.get(k)]));  // AI interviews add "ai": the interviewer is an AI
    try {
      await pub("/consent", { method: "POST", body: { country: fd.get("country"), ...agreed } });
      info.consented = true; afterConsent();
    } catch (err) {
      if (err.status === 403) { frame(IX.consent, `<h1>${x.no}</h1><p class="mut">${esc(err.message)}</p>`); return; }
      throw err;
    }
  });
}

// ---------- 2b. pre-interview questions (only when the research team configured them) ----------
function preStep() {
  const qs = info.pretask.questions;
  frame(IX.pre, `<form class="card" id="pf"><h1 style="margin-bottom:10px">${x.preTitle}</h1><p class="mut">${esc(x.preIntro)}</p>
    ${qs.map((q) => `<label class="f"><span>${esc(q.prompt)}${q.required ? ' <b aria-hidden="true">*</b>' : ""}</span><textarea name="${q.key}" rows="3" ${q.required ? "required" : ""}></textarea></label>`).join("")}
    <button class="p pbig">${x.preGo}</button></form>`);
  const f = $("#pf");
  f.onsubmit = guard(async (e) => {
    e.preventDefault();
    const fd = new FormData(f);
    const answers = {};
    qs.forEach((q) => { answers[q.key] = (fd.get(q.key) || "").toString().trim(); });  // the quote text is always re-derived server-side; here we just submit
    await pub("/pretask", { method: "POST", body: { answers } });
    info.pretask.done = true; waitStep();
  });
}

// ---------- 3. into the room: outside the time window they wait here; inside it a human-moderated interview waits for the moderator to let them in (once), then they go in by themselves ----------
let waitTimer = null;
function waitStep() {
  const url = `/room.html?t=${encodeURIComponent(t)}`;
  if (info.can_enter_now) { location.replace(url); return; }   // the room is open to this person: straight in (inside the room they wait for the moderator to start)
  const msg = () => (info.window_ok === false ? x.notTime : info.admitted ? x.admittedWait : x.waiting);
  frame(IX.wait, `<h1>${x.wait}</h1><div class="pwait" id="pw" role="status"><span class="dot" aria-hidden="true"></span><span id="pwt">${msg()}</span></div><p class="mut">${esc(x.tips)}</p>`);
  const poll = async () => {
    try { info = await pub(""); }
    catch { $("#pwt").textContent = x.netWait; return; }   // keep trying, and say so: a silent stall looks like a dead page
    if (info.status === "ended") { clearInterval(waitTimer); $("#pw").className = "pwait go"; $("#pwt").textContent = x.ended; return; }
    if (info.can_enter_now) { clearInterval(waitTimer); $("#pw").className = "pwait go"; $("#pwt").textContent = x.enterNow; location.replace(url); return; }
    $("#pw").className = info.admitted && info.window_ok !== false ? "pwait go" : "pwait";   // admitted: green, the room opens within seconds
    $("#pwt").textContent = msg();
    pub("/live?waiting=1").catch(() => {});   // so the moderator sees who is at the door
  };
  clearInterval(waitTimer); waitTimer = setInterval(poll, 3000); poll();
}

(async () => {
  try { info = await pub(""); }
  catch { box.innerHTML = `<h1>${L.en.bad} · ${L.zh.bad}</h1><p class="mut">${L.en.badp}</p><p class="mut">${L.zh.badp}</p>`; return; }
  x = L[info.consent.lang] || L.en;
  buildFlow();
  document.documentElement.lang = info.consent.lang === "zh" ? "zh-CN" : info.consent.lang;
  document.title = x.invite + " · 星桐";
  pub("/opened", { method: "POST" }).catch(() => {});
  if (info.status === "ended") { frame(STEPS.length - 1, `<h1>${x.ended}</h1>`); return; }
  if (info.timeslots && info.timeslots.group) return voteStep();
  if (info.timeslots && info.timeslots.slots.length) return timeStep();  // must choose a time first, whatever else is done
  if (info.consented) return afterConsent();
  if (info.device_ok) return consentStep();
  inviteStep();
})();
addEventListener("pagehide", stopDev);
</script></body></html>
